name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a **security vulnerability**, do not open an issue: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Taba version
      description: Server and connector versions (for example `v0.1.5`, `taba-client 0.1.5`).
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: How are you running Taba?
      options: [Docker Compose, Helm (Kubernetes), Binary, Other]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Cluster size, configuration keys, client calls. The smaller, the better.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Does it lose or duplicate messages, or corrupt data?
      options: ["No", "Yes", "Not sure"]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Node logs around the problem. Remove tokens and secrets.
      render: text
