# Pull request validation: calls the three builds (server, Rust connector and C# connector), with no version.
# On release, release.yml calls the same workflows, with the tag version.
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    uses: ./.github/workflows/build-server.yml

  connector-rust:
    uses: ./.github/workflows/build-connector-rust.yml

  connector-csharp:
    uses: ./.github/workflows/build-connector-csharp.yml
