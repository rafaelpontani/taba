# Validation of every pull request to main and release: the three builds (server, Rust connector and C# connector,
# with no version), the static checks of the Helm chart and the lint of the workflows themselves. Publishes nothing.
#
# Only `pull_request`, not `push`: with a PR open, a push fires both events and everything would run twice. A
# branch without a PR is validated by hand (workflow_dispatch). main and release are not here: a push to them runs
# release.yml, which calls the same builds and only publishes when semantic-release finds a version. These jobs are
# the required status checks of the main and release rulesets (doc/pt-BR/27-ci-cd.md).
name: CI

on:
  pull_request:
    branches: [main, release]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server
    uses: ./.github/workflows/build-server.yml

  connector-rust:
    name: Rust connector
    uses: ./.github/workflows/build-connector-rust.yml

  connector-csharp:
    name: C# connector
    uses: ./.github/workflows/build-connector-csharp.yml

  connector-node:
    name: Node.js connector
    uses: ./.github/workflows/build-connector-node.yml

  connector-python:
    name: Python connector
    uses: ./.github/workflows/build-connector-python.yml

  connector-java:
    name: Java connector
    uses: ./.github/workflows/build-connector-java.yml

  connector-omb:
    name: OMB driver
    uses: ./.github/workflows/build-connector-omb.yml

  # The five connectors against a real node (builds the server image: slow, so only for what goes to release).
  connector-contract:
    name: Connector contract tests
    if: github.base_ref == 'release' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/contract-connectors.yml

  # Chart lint, rendering of every ci/*.yaml, assertions on the manifests and the chart's refusals. No cluster.
  # The e2e cases (kind) run by hand: deploy/helm/tests/run.sh 01 05 ... (doc/pt-BR/35-chart-helm-casos-de-uso.md).
  helm:
    name: Helm chart (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - run: deploy/helm/tests/run.sh static

  # doc/plans/ holds plans still being developed: they live only on the working branch and are deleted when
  # executed, so a pull request to release or main that still has a file there fails (AGENTS.md).
  plans:
    name: Development plans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          files="$(git ls-files doc/plans)"
          if [ -n "$files" ]; then
            echo "::error::doc/plans/ must not reach release or main; delete the plan files before merging:"
            echo "$files"
            exit 1
          fi

  # Known vulnerabilities (RustSec) in the locked dependencies of the server and of the Rust connectors: the same
  # advisories the OpenSSF Scorecard counts. Dependabot opens the update; this job keeps one from being merged.
  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-audit
      - run: cargo audit --file Cargo.lock
      - run: cargo audit --file connectors/rust/Cargo.lock

  # The workflows are code that publishes: actionlint (syntax and expressions) and zizmor (security: injection,
  # excessive permissions, unpinned actions, leaked credentials).
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          # The low findings left are only `self-repository` (the `$/` syntax for local workflows); `./` stays.
          min-severity: medium
