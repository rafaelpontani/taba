# Validação de pull request: chama os três builds (servidor, conector Rust e conector C#), sem versão.
# Na release, o release.yml chama os mesmos workflows, com a versão da tag.
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    uses: ./.github/workflows/build-server.yml

  connector-rust:
    uses: ./.github/workflows/build-connector-rust.yml

  connector-csharp:
    uses: ./.github/workflows/build-connector-csharp.yml
