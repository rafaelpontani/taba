# Build and tests of the Java connector on the base version (11) and the latest LTS. Called by ci.yml.
# The connector is not published yet (D70.1: the Maven groupId is still open).
name: Java connector build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  connector-java:
    name: Java connector (tests, JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ["11", "21"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Maven repository is kept between runs: Maven Central answers 429 (Too Many Requests) to the GitHub runners
      # when every job downloads everything again (KI-040).
      - name: Maven repository cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/m2
          key: m2-java-${{ matrix.jdk }}-${{ hashFiles('connectors/java/pom.xml') }}
          restore-keys: m2-java-${{ matrix.jdk }}-
      - name: Tests
        env:
          JDK: ${{ matrix.jdk }}
          TABA_M2_DIR: ${{ runner.temp }}/m2
        run: |
          docker run --rm -v "$PWD/connectors/java:/work" -v "$TABA_M2_DIR:/root/.m2/repository" -w /work "maven:3.9-eclipse-temurin-${JDK}" mvn -B -q clean test
