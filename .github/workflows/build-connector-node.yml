# Tests of the Node.js connector on the base version (18) and the latest LTS. Called by ci.yml.
# The connector is not published yet (D70.1: the npm package name is still open).
name: Node.js connector build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  connector-node:
    name: Node.js connector (tests, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests
        env:
          NODE: ${{ matrix.node }}
        run: |
          docker run --rm -v "$PWD/connectors/node:/work" -w /work "node:${NODE}-slim" node --test
