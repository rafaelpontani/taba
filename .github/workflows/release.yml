# A cada push na release (candidatas, X.Y.Z-rc.N) ou na main (versões finais, X.Y.Z): o semantic-release
# calcula a versão pelos commits (Conventional Commits) e cria a tag e a GitHub Release primeiro. Depois
# rodam os testes; se passarem, o binário é compilado com essa versão, e o pipeline publica a imagem no
# Docker Hub e move as tags flutuantes. Commits sem
# feat/fix/perf (docs, chore, ci...) não geram versão.
#
# Imagem no Docker Hub e tags git flutuantes (cada uma só avança se a versão for a maior do escopo):
#   0.1.0-rc.2 -> 0.1.0-rc.2, 0.1-rc, 0-rc, rc          (git: v0.1-rc, v0-rc)
#   0.1.0      -> 0.1.0, 0.1, 0, latest                 (git: v0.1, v0)
#
# Configuração do semantic-release: .releaserc.json. Fluxo de candidatas e promoção: doc/21-pipeline-ci-cd.md.
name: Release

on:
  push:
    branches: [main, release]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A versão sai primeiro, antes de qualquer outro job. Os testes (ci) vêm depois e só liberam o binário.
  version:
    name: Versão (semantic-release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.release.outputs.new_release_published }}
      version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    name: Testes
    needs: version
    uses: ./.github/workflows/ci.yml

  plan:
    name: Plano de tags
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    outputs:
      docker_tags: ${{ steps.plan.outputs.docker_tags }}
      git_tags: ${{ steps.plan.outputs.git_tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          re='^([0-9]+)\.([0-9]+)\.([0-9]+)(-rc\.([0-9]+))?$'
          if [[ ! $VERSION =~ $re ]]; then
            echo "versão inesperada: $VERSION" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          rc="${BASH_REMATCH[4]}"

          # A maior versão, entre as tags da mesma família (rc ou final), que casa com o filtro.
          highest() {
            git tag -l 'v*.*.*' | sed 's/^v//' | grep -E "$1" | sort -V | tail -n 1
          }

          docker_tags=("$VERSION")
          git_tags=()
          if [[ -n $rc ]]; then
            family='-rc\.[0-9]+$'
            [[ $(highest "^${major}\.${minor}\.[0-9]+${family}") == "$VERSION" ]] \
              && docker_tags+=("${major}.${minor}-rc") && git_tags+=("v${major}.${minor}-rc")
            [[ $(highest "^${major}\.[0-9]+\.[0-9]+${family}") == "$VERSION" ]] \
              && docker_tags+=("${major}-rc") && git_tags+=("v${major}-rc")
            [[ $(highest "^[0-9]+\.[0-9]+\.[0-9]+${family}") == "$VERSION" ]] \
              && docker_tags+=("rc")
          else
            family='$'
            [[ $(highest "^${major}\.${minor}\.[0-9]+${family}") == "$VERSION" ]] \
              && docker_tags+=("${major}.${minor}") && git_tags+=("v${major}.${minor}")
            [[ $(highest "^${major}\.[0-9]+\.[0-9]+${family}") == "$VERSION" ]] \
              && docker_tags+=("${major}") && git_tags+=("v${major}")
            [[ $(highest "^[0-9]+\.[0-9]+\.[0-9]+${family}") == "$VERSION" ]] \
              && docker_tags+=("latest")
          fi

          {
            echo "docker_tags=${docker_tags[*]}"
            echo "git_tags=${git_tags[*]:-}"
          } >> "$GITHUB_OUTPUT"
          echo "docker: ${docker_tags[*]}"
          echo "git flutuantes: ${git_tags[*]:-nenhuma}"

  binary:
    name: Binário do nó (versão da tag)
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      # Alinha o Cargo.toml, o Cargo.lock e os .csproj à versão da tag (só no build, sem commitar).
      # O binário guarda essa versão (`taba --version`, /health, telemetria), por isso compila aqui.
      - run: .github/scripts/set-version.sh "${{ needs.version.outputs.version }}"
      - uses: ./.github/actions/node-binary
      - uses: actions/upload-artifact@v4
        with:
          name: taba-node
          path: dist/taba
          retention-days: 1

  docker:
    name: Imagem no Docker Hub
    needs: [version, ci, plan, binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: taba-node
          path: dist
      # O artefato perde a permissão de execução ao ser baixado.
      - run: chmod +x dist/taba
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tags
        shell: bash
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/taba
          DOCKER_TAGS: ${{ needs.plan.outputs.docker_tags }}
        run: |
          {
            echo "list<<EOF"
            for t in $DOCKER_TAGS; do echo "$IMAGE:$t"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          push: true
          tags: ${{ steps.tags.outputs.list }}

  floating-tags:
    name: Tags flutuantes
    needs: [version, plan, docker]
    if: needs.plan.outputs.git_tags != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      - shell: bash
        env:
          GIT_TAGS: ${{ needs.plan.outputs.git_tags }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for t in $GIT_TAGS; do
            git tag -f "$t" HEAD
            git push -f origin "refs/tags/$t"
          done
