# A cada push na release (candidatas, X.Y.Z-rc.N) ou na main (versões finais, X.Y.Z): o semantic-release
# calcula a versão pelos commits (Conventional Commits) e cria a tag e a GitHub Release primeiro. Depois
# os builds (servidor, conector Rust e conector C#) compilam e testam com essa versão e enviam os binários como artefatos. Se os testes passarem, em
# paralelo: o job de Docker baixa o binário do nó e publica a imagem no Docker Hub, e o job de release
# anexa os binários e pacotes à GitHub Release. Depois movem as tags flutuantes.
# Commits sem feat/fix/perf (docs, chore, ci...) não geram versão.
#
# Imagem no Docker Hub e tags git flutuantes (cada uma só avança se a versão for a maior do escopo):
#   0.1.0-rc.2 -> 0.1.0-rc.2, 0.1-rc, 0-rc, rc          (git: v0.1-rc, v0-rc)
#   0.1.0      -> 0.1.0, 0.1, 0, latest                 (git: v0.1, v0)
#
# Configuração do semantic-release: .releaserc.json. Fluxo de candidatas e promoção: doc/21-pipeline-ci-cd.md.
name: Release

on:
  push:
    branches: [main, release]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A versão sai primeiro, antes de qualquer outro job. Build e testes (ci) usam essa versão.
  version:
    name: Versão (semantic-release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.release.outputs.new_release_published }}
      version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Os três builds saem em paralelo, cada um com a versão da tag. O que as imagens e a release usam
  # (servidor e conector Rust) não espera o conector C#, e vice-versa.
  server:
    name: Servidor
    needs: version
    uses: ./.github/workflows/build-server.yml
    with:
      version: ${{ needs.version.outputs.version }}

  connector-rust:
    name: Conector Rust
    needs: version
    uses: ./.github/workflows/build-connector-rust.yml
    with:
      version: ${{ needs.version.outputs.version }}

  connector-csharp:
    name: Conector C#
    needs: version
    uses: ./.github/workflows/build-connector-csharp.yml
    with:
      version: ${{ needs.version.outputs.version }}

  plan:
    name: Plano de tags
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    outputs:
      docker_tags: ${{ steps.plan.outputs.docker_tags }}
      git_tags: ${{ steps.plan.outputs.git_tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          re='^([0-9]+)\.([0-9]+)\.([0-9]+)(-rc\.([0-9]+))?$'
          if [[ ! $VERSION =~ $re ]]; then
            echo "versão inesperada: $VERSION" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          rc="${BASH_REMATCH[4]}"

          # A maior versão, entre as tags da mesma família (rc ou final), que casa com o filtro.
          highest() {
            git tag -l 'v*.*.*' | sed 's/^v//' | grep -E "$1" | sort -V | tail -n 1
          }

          docker_tags=("$VERSION")
          git_tags=()
          if [[ -n $rc ]]; then
            family='-rc\.[0-9]+$'
            [[ $(highest "^${major}\.${minor}\.[0-9]+${family}") == "$VERSION" ]] \
              && docker_tags+=("${major}.${minor}-rc") && git_tags+=("v${major}.${minor}-rc")
            [[ $(highest "^${major}\.[0-9]+\.[0-9]+${family}") == "$VERSION" ]] \
              && docker_tags+=("${major}-rc") && git_tags+=("v${major}-rc")
            [[ $(highest "^[0-9]+\.[0-9]+\.[0-9]+${family}") == "$VERSION" ]] \
              && docker_tags+=("rc")
          else
            family='$'
            [[ $(highest "^${major}\.${minor}\.[0-9]+${family}") == "$VERSION" ]] \
              && docker_tags+=("${major}.${minor}") && git_tags+=("v${major}.${minor}")
            [[ $(highest "^${major}\.[0-9]+\.[0-9]+${family}") == "$VERSION" ]] \
              && docker_tags+=("${major}") && git_tags+=("v${major}")
            [[ $(highest "^[0-9]+\.[0-9]+\.[0-9]+${family}") == "$VERSION" ]] \
              && docker_tags+=("latest")
          fi

          {
            echo "docker_tags=${docker_tags[*]}"
            echo "git_tags=${git_tags[*]:-}"
          } >> "$GITHUB_OUTPUT"
          echo "docker: ${docker_tags[*]}"
          echo "git flutuantes: ${git_tags[*]:-nenhuma}"

  docker:
    name: Imagens no Docker Hub
    needs: [version, server, connector-rust, plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      # Baixa taba-node-* e taba-cli-*: dist/taba-amd64, dist/taba-arm64, dist/taba-cli-amd64 e
      # dist/taba-cli-arm64.
      - uses: actions/download-artifact@v4
        with:
          pattern: taba-*
          merge-multiple: true
          path: dist
      # O artefato perde a permissão de execução ao ser baixado.
      - run: chmod +x dist/taba-*
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tags
        shell: bash
        env:
          USER_NAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TAGS: ${{ needs.plan.outputs.docker_tags }}
        run: |
          {
            echo "server<<EOF"
            for t in $DOCKER_TAGS; do echo "$USER_NAME/taba:$t"; done
            echo "EOF"
            echo "cli<<EOF"
            for t in $DOCKER_TAGS; do echo "$USER_NAME/taba-cli:$t"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.server }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cli.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.cli }}

  # Os binários e pacotes do ci vão para a GitHub Release da versão, em paralelo com a imagem Docker.
  release-assets:
    name: Binários na GitHub Release
    needs: [version, server, connector-rust, connector-csharp, docker]
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Sem checkout não há .git aqui: o gh precisa saber o repositório por esta variável.
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Baixa uma pasta por artefato: taba-node-amd64, taba-node-arm64, taba-cli-amd64, taba-cli-arm64 e
      # nuget-packages.
      # Só os artefatos da release: sem filtro, o download pega também os `*.dockerbuild` que o
      # build-push-action gera, e o download falha depois de 5 tentativas.
      - uses: actions/download-artifact@v4
        with:
          pattern: taba-*
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: assets/nuget-packages
      # Nome com a versão e a arquitetura, para não se confundir com binários de outras releases.
      - name: Renomeia com a versão
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          mv assets/taba-node-amd64/taba-amd64 "release/taba-$VERSION-x86_64-unknown-linux-musl"
          mv assets/taba-node-arm64/taba-arm64 "release/taba-$VERSION-aarch64-unknown-linux-musl"
          mv assets/taba-cli-amd64/taba-cli-amd64 "release/taba-cli-$VERSION-x86_64-unknown-linux-musl"
          mv assets/taba-cli-arm64/taba-cli-arm64 "release/taba-cli-$VERSION-aarch64-unknown-linux-musl"
          cp assets/nuget-packages/*.nupkg release/
          ls -l release
      - name: Envia para a release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "v$VERSION" release/* --clobber

  floating-tags:
    name: Tags flutuantes
    needs: [version, plan, release-assets]
    if: needs.plan.outputs.git_tags != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      - shell: bash
        env:
          GIT_TAGS: ${{ needs.plan.outputs.git_tags }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for t in $GIT_TAGS; do
            git tag -f "$t" HEAD
            git push -f origin "refs/tags/$t"
          done
