# Runs when semantic-release (semantic.yml) creates the tag of a version: vX.Y.Z (final, from main) or
# vX.Y.Z-rc.N (candidate, from release). semantic.yml triggers it with the ref on the tag; a tag push also works.
# The builds (server, Rust connector and C# connector) compile and test with the tag version and upload the
# binaries as artifacts. If the tests pass, in parallel: the Docker job downloads the node binary and
# publishes the image to Docker Hub, and the release job attaches the binaries and packages to the GitHub
# Release. Afterwards the floating tags move.
#
# The floating tags (v0.1, v0, v0.1-rc, v0-rc) MUST NOT trigger this workflow: the filters below only
# accept full tags, the `version` job checks again, and floating-tags pushes them with the GITHUB_TOKEN,
# which does not trigger workflows.
#
# Docker Hub image and floating git tags (each one only advances if the version is the highest in its scope):
#   0.1.0-rc.2 -> 0.1.0-rc.2, 0.1-rc, 0-rc, rc          (git: v0.1-rc, v0-rc)
#   0.1.0      -> 0.1.0, 0.1, 0, latest                 (git: v0.1, v0)
#
# semantic-release configuration: .releaserc.json. Candidate and promotion flow: doc/pt-BR/27-ci-cd.md.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  # semantic.yml triggers it with `--ref vX.Y.Z`: a tag created with the GITHUB_TOKEN does not raise the push event.
  # Triggered on a branch or a floating tag, the `version` job does not pass and nothing runs.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The version comes from the tag that triggered the workflow. Build and tests use that version.
  version:
    name: Version (tag)
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.tag.outputs.published }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      # Second barrier against floating or non-standard tags: only proceeds with vX.Y.Z[-rc.N].
      - id: tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag ignored: $TAG"
          fi

  # The three builds run in parallel, each with the tag version. What the images and the release use
  # (server and Rust connector) does not wait for the C# connector, and vice versa.
  server:
    name: Server
    needs: version
    if: needs.version.outputs.published == 'true'
    uses: ./.github/workflows/build-server.yml
    with:
      version: ${{ needs.version.outputs.version }}

  connector-rust:
    name: Rust connector
    needs: version
    if: needs.version.outputs.published == 'true'
    uses: ./.github/workflows/build-connector-rust.yml
    with:
      version: ${{ needs.version.outputs.version }}

  connector-csharp:
    name: C# connector
    needs: version
    if: needs.version.outputs.published == 'true'
    uses: ./.github/workflows/build-connector-csharp.yml
    with:
      version: ${{ needs.version.outputs.version }}

  plan:
    name: Tag plan
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    outputs:
      docker_tags: ${{ steps.plan.outputs.docker_tags }}
      git_tags: ${{ steps.plan.outputs.git_tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          re='^([0-9]+)\.([0-9]+)\.([0-9]+)(-rc\.([0-9]+))?$'
          if [[ ! $VERSION =~ $re ]]; then
            echo "unexpected version: $VERSION" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          rc="${BASH_REMATCH[4]}"

          # The highest version, among the tags of the same family (rc or final), that matches the filter.
          highest() {
            git tag -l 'v*.*.*' | sed 's/^v//' | grep -E "$1" | sort -V | tail -n 1
          }

          docker_tags=("$VERSION")
          git_tags=()
          if [[ -n $rc ]]; then
            family='-rc\.[0-9]+$'
            [[ $(highest "^${major}\.${minor}\.[0-9]+${family}") == "$VERSION" ]] \
              && docker_tags+=("${major}.${minor}-rc") && git_tags+=("v${major}.${minor}-rc")
            [[ $(highest "^${major}\.[0-9]+\.[0-9]+${family}") == "$VERSION" ]] \
              && docker_tags+=("${major}-rc") && git_tags+=("v${major}-rc")
            [[ $(highest "^[0-9]+\.[0-9]+\.[0-9]+${family}") == "$VERSION" ]] \
              && docker_tags+=("rc")
          else
            family='$'
            [[ $(highest "^${major}\.${minor}\.[0-9]+${family}") == "$VERSION" ]] \
              && docker_tags+=("${major}.${minor}") && git_tags+=("v${major}.${minor}")
            [[ $(highest "^${major}\.[0-9]+\.[0-9]+${family}") == "$VERSION" ]] \
              && docker_tags+=("${major}") && git_tags+=("v${major}")
            [[ $(highest "^[0-9]+\.[0-9]+\.[0-9]+${family}") == "$VERSION" ]] \
              && docker_tags+=("latest")
          fi

          {
            echo "docker_tags=${docker_tags[*]}"
            echo "git_tags=${git_tags[*]:-}"
          } >> "$GITHUB_OUTPUT"
          echo "docker: ${docker_tags[*]}"
          echo "floating git: ${git_tags[*]:-none}"

  docker:
    name: Images on Docker Hub
    needs: [version, server, connector-rust, plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      # Downloads taba-node-* and taba-cli-*: dist/taba-amd64, dist/taba-arm64, dist/taba-cli-amd64 and
      # dist/taba-cli-arm64.
      - uses: actions/download-artifact@v4
        with:
          pattern: taba-*
          merge-multiple: true
          path: dist
      # The artifact loses its execute permission when downloaded.
      - run: chmod +x dist/taba-*
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tags
        shell: bash
        env:
          USER_NAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TAGS: ${{ needs.plan.outputs.docker_tags }}
        run: |
          {
            echo "server<<EOF"
            for t in $DOCKER_TAGS; do echo "$USER_NAME/taba:$t"; done
            echo "EOF"
            echo "cli<<EOF"
            for t in $DOCKER_TAGS; do echo "$USER_NAME/taba-cli:$t"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.server }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cli.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.cli }}

  # The binaries and packages from ci go to the version's GitHub Release, in parallel with the Docker image.
  release-assets:
    name: Binaries on the GitHub Release
    needs: [version, server, connector-rust, connector-csharp, docker]
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Without a checkout there is no .git here: gh needs to know the repository from this variable.
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Downloads one folder per artifact: taba-node-amd64, taba-node-arm64, taba-cli-amd64, taba-cli-arm64 and
      # nuget-packages.
      # Only the release artifacts: without a filter, the download also picks up the `*.dockerbuild` files that
      # build-push-action generates, and the download fails after 5 attempts.
      - uses: actions/download-artifact@v4
        with:
          pattern: taba-*
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: assets/nuget-packages
      # Name with the version and the architecture, so it is not confused with binaries of other releases.
      - name: Rename with the version
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          mv assets/taba-node-amd64/taba-amd64 "release/taba-$VERSION-x86_64-unknown-linux-musl"
          mv assets/taba-node-arm64/taba-arm64 "release/taba-$VERSION-aarch64-unknown-linux-musl"
          mv assets/taba-cli-amd64/taba-cli-amd64 "release/taba-cli-$VERSION-x86_64-unknown-linux-musl"
          mv assets/taba-cli-arm64/taba-cli-arm64 "release/taba-cli-$VERSION-aarch64-unknown-linux-musl"
          cp assets/nuget-packages/*.nupkg release/
          ls -l release
      - name: Upload to the release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "v$VERSION" release/* --clobber

  floating-tags:
    name: Floating tags
    needs: [version, plan, release-assets]
    if: needs.plan.outputs.git_tags != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      - shell: bash
        env:
          GIT_TAGS: ${{ needs.plan.outputs.git_tags }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for t in $GIT_TAGS; do
            git tag -f "$t" HEAD
            git push -f origin "refs/tags/$t"
          done
