# On every push to release (candidates, X.Y.Z-rc.N) or main (final versions, X.Y.Z): semantic-release
# computes the version from the commits (Conventional Commits) and creates the tag and the GitHub Release. Just that. The rest
# of the pipeline (build, tests, Docker, binaries on the Release, floating tags) is in release.yml, which this
# workflow triggers for the newly created vX.Y.Z tag. No PAT needed: everything uses the GITHUB_TOKEN.
# Commits without feat/fix/perf (docs, chore, ci...) do not produce a version: the job ends without creating a tag.
#
# semantic-release configuration: .releaserc.json. Candidate and promotion flow: doc/pt-BR/27-ci-cd.md.
name: Semantic

on:
  push:
    branches: [main, release]

concurrency:
  group: semantic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Simulation (dry-run): shows in the run summary which version would come out, without creating a tag or a Release.
  # The approval is the MR that takes the commit to the branch; the preview only records what will come out.
  preview:
    name: Version preview
    runs-on: ubuntu-latest
    # The semantic-release dry-run does a `git push --dry-run` to check permission, and that requires
    # write access on the token, even though it creates nothing. The whole workflow has contents: read.
    permissions:
      contents: write
    outputs:
      published: ${{ steps.dry.outputs.new_release_published }}
      version: ${{ steps.dry.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: dry
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
          semantic_version: 24
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Summary
        shell: bash
        env:
          PUBLISHED: ${{ steps.dry.outputs.new_release_published }}
          VERSION: ${{ steps.dry.outputs.new_release_version }}
          BRANCH: ${{ github.ref_name }}
          NOTES: ${{ steps.dry.outputs.new_release_notes }}
        run: |
          {
            if [[ $PUBLISHED == 'true' ]]; then
              echo "## Version that will be generated: \`v$VERSION\` (branch \`$BRANCH\`)"
              echo
              echo "$NOTES"
            else
              echo "## No version will be generated"
              echo
              echo "The commits since the last tag have no feat, fix or perf."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Creates the tag for real, automatically, if the preview found a version.
  semantic:
    name: Semantic (creates the tag)
    needs: preview
    if: needs.preview.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A tag created with the GITHUB_TOKEN does not trigger the `on: push: tags` of release.yml (a GitHub rule).
      # workflow_dispatch is the allowed exception: it triggers release.yml with the ref on the tag, and there
      # github.ref_name is the tag itself.
      - name: Trigger release.yml on the tag
        if: steps.release.outputs.new_release_published == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.release.outputs.new_release_version }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
