# A cada push na release (candidatas, X.Y.Z-rc.N) ou na main (versões finais, X.Y.Z): o semantic-release
# calcula a versão pelos commits (Conventional Commits) e cria a tag e a GitHub Release. Só isso. O resto
# do pipeline (build, testes, Docker, binários na Release, tags flutuantes) está no release.yml, que este
# workflow dispara para a tag vX.Y.Z recém-criada. Não precisa de PAT: tudo usa o GITHUB_TOKEN.
# Commits sem feat/fix/perf (docs, chore, ci...) não geram versão: o job termina sem criar tag.
#
# Configuração do semantic-release: .releaserc.json. Fluxo de candidatas e promoção: doc/pt-BR/27-ci-cd.md.
name: Semantic

on:
  push:
    branches: [main, release]

concurrency:
  group: semantic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Simulação (dry-run): mostra no resumo da execução qual versão sairia, sem criar tag nem Release.
  # A aprovação é a do MR que leva o commit à branch; a prévia só registra o que vai sair.
  preview:
    name: Prévia da versão
    runs-on: ubuntu-latest
    # O dry-run do semantic-release faz `git push --dry-run` para checar permissão, e isso exige
    # escrita no token, mesmo sem criar nada. O workflow inteiro está com contents: read.
    permissions:
      contents: write
    outputs:
      published: ${{ steps.dry.outputs.new_release_published }}
      version: ${{ steps.dry.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: dry
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
          semantic_version: 24
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resumo
        shell: bash
        env:
          PUBLISHED: ${{ steps.dry.outputs.new_release_published }}
          VERSION: ${{ steps.dry.outputs.new_release_version }}
          BRANCH: ${{ github.ref_name }}
          NOTES: ${{ steps.dry.outputs.new_release_notes }}
        run: |
          {
            if [[ $PUBLISHED == 'true' ]]; then
              echo "## Versão que será gerada: \`v$VERSION\` (branch \`$BRANCH\`)"
              echo
              echo "$NOTES"
            else
              echo "## Nenhuma versão será gerada"
              echo
              echo "Os commits desde a última tag não têm feat, fix ou perf."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Cria a tag de verdade, automaticamente, se a prévia achou versão.
  semantic:
    name: Semantic (cria a tag)
    needs: preview
    if: needs.preview.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A tag criada com o GITHUB_TOKEN não dispara o `on: push: tags` do release.yml (regra do GitHub).
      # O workflow_dispatch é a exceção permitida: dispara o release.yml com a ref na tag, e lá o
      # github.ref_name é a própria tag.
      - name: Dispara o release.yml na tag
        if: steps.release.outputs.new_release_published == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.release.outputs.new_release_version }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
