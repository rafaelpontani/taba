# The Terraform provider (connectors/terraform): gofmt, vet, golangci-lint and the unit tests, and docs/ (what the
# registry shows, generated by tfplugindocs) up to date. The acceptance tests against a node run in
# contract-connectors.yml, which builds the node image. Called by ci.yml.
name: Terraform provider build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  connector-terraform:
    name: Terraform provider (unit tests, lint and docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: gofmt, vet and unit tests
        run: connectors/terraform/scripts/test.sh unit
      - name: golangci-lint
        run: connectors/terraform/scripts/test.sh lint
      - name: docs/ up to date
        run: connectors/terraform/scripts/test.sh docs
