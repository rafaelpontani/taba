# Build and tests of the server (taba-node), for x86_64 and arm64 on native runners. Called by ci.yml (pull
# request) and by release.yml, which passes the tag version. Uploads the static binary as the artifact
# `taba-node-<arch>`, used by the Docker image and the GitHub Release.
name: Server build

on:
  workflow_call:
    inputs:
      version:
        description: Release version (X.Y.Z or X.Y.Z-rc.N). Empty on pull requests.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: Server (build and tests, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            triple: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            triple: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Release version
        if: inputs.version != ''
        run: .github/scripts/set-version.sh "${{ inputs.version }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.triple }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # Formatting and lint only on x86_64: the code is the same, no need to repeat.
      - run: cargo fmt --all --check
        if: matrix.arch == 'amd64'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: matrix.arch == 'amd64'
      - run: cargo test --workspace --locked
      # Static (musl) binary of the node, for the Docker image and the release.
      - uses: ./.github/actions/node-binary
        with:
          target: ${{ matrix.triple }}-unknown-linux-musl
          arch: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: taba-node-${{ matrix.arch }}
          path: dist/taba-${{ matrix.arch }}
          retention-days: 1
