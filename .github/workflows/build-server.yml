# Build and tests of the server (taba-node), for x86_64 and arm64 on native runners. Called by ci.yml (branches and
# pull requests) and by release.yml, which passes the version computed by semantic-release. Uploads the static
# binary as the artifact `taba-node-<arch>`, used by the Docker image and the GitHub Release.
#
# The actions are pinned by commit SHA (the comment says the version); Dependabot proposes the updates.
name: Server build

on:
  workflow_call:
    inputs:
      version:
        description: Release version (X.Y.Z or X.Y.Z-rc.N). Empty when there is no release.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # `taba --version` shows the commit the binary was built from.
  TABA_GIT_SHA: ${{ github.sha }}

jobs:
  server:
    name: Server (build and tests, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            triple: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            triple: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: .github/scripts/set-version.sh "$VERSION"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: ${{ matrix.triple }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Formatting and lint only on x86_64: the code is the same, no need to repeat.
      - run: cargo fmt --all --check
        if: matrix.arch == 'amd64'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: matrix.arch == 'amd64'
      - run: cargo test --workspace --locked
      # Static (musl) binary of the node, for the Docker image and the release.
      - uses: ./.github/actions/node-binary
        with:
          target: ${{ matrix.triple }}-unknown-linux-musl
          arch: ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: taba-node-${{ matrix.arch }}
          path: dist/taba-${{ matrix.arch }}
          retention-days: 1
