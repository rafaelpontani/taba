# Tests of the PHP connector on the base version (5.6) and a current one. Called by ci.yml.
# The connector is not published yet (D70.1, D70.2: the Packagist name and the mirror are still open).
name: PHP connector build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  connector-php:
    name: PHP connector (tests, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["5.6", "8.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax and tests
        env:
          PHP: ${{ matrix.php }}
        run: |
          docker run --rm -v "$PWD/connectors/php:/work" -w /work "php:${PHP}-cli" \
            sh -c 'for f in src/*.php; do php -l "$f" || exit 1; done && php tests/run.php'
