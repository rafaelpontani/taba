# Tests of the Go connector on the base version (1.7) and a current one. Called by ci.yml.
# The connector is not published yet (D70.1: the module path and the tag scheme are still open).
name: Go connector build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  connector-go:
    name: Go connector (tests, Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.7", "1.23"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go 1.7 has no modules: the repository is mounted where GOPATH expects the package (GO111MODULE=off for the new one).
      - name: Vet and tests
        env:
          GO: ${{ matrix.go }}
        run: |
          docker run --rm -e GO111MODULE=off -v "$PWD:/go/src/github.com/rafaelpontani/taba" \
            -w /go/src/github.com/rafaelpontani/taba/connectors/go "golang:${GO}" \
            sh -c 'test -z "$(gofmt -l .)" && go vet . && go test -race -count=1 .'
