# Build and tests of the C# connector and NuGet packages. Called by ci.yml (pull request) and by release.yml, which
# passes the tag version. Uploads the .nupkg files as the `nuget-packages` artifact, used by the GitHub Release.
name: C# connector build

on:
  workflow_call:
    inputs:
      version:
        description: Release version (X.Y.Z or X.Y.Z-rc.N). Empty on pull requests.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  connector-csharp:
    name: C# connector (build and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release version
        if: inputs.version != ''
        run: .github/scripts/set-version.sh "${{ inputs.version }}"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      # Without TABA_URL the integration tests are skipped; the real cluster lives in the `integration` job.
      - run: dotnet test connectors/csharp/Taba.Client.Tests/Taba.Client.Tests.csproj --configuration Release
      - name: NuGet packages
        run: |
          for p in connectors/csharp/Taba.Client/Taba.Client.csproj \
                   connectors/csharp/Taba.Client.Abstractions/Taba.Client.Abstractions.csproj \
                   connectors/csharp/Taba.Client.Extensions.DependencyInjection/Taba.Client.Extensions.DependencyInjection.csproj; do
            dotnet pack "$p" --configuration Release --output nupkg
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: nupkg/*.nupkg
          retention-days: 1
