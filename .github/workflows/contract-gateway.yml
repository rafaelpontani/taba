# Contract tests of the SQS and SNS gateway (connectors/gateway-contract/README.md): the native AWS SDK of six languages
# (C#, Java, Rust, Go, Python, Node.js, each in a current and in an older Query-protocol version) against one Taba node
# built from this commit with gateway.sqs and gateway.sns on, then each language reading what the previous one sent.
# The same scenarios (scenarios/aws/) also run on ElasticMQ and moto: that is what shows that the tests are right.
# Called by ci.yml (pull requests to release). Publishes nothing.
name: Gateway contract tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    name: Scenarios on the emulators
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Maven repository is kept between runs: Maven Central answers 429 (Too Many Requests) to the GitHub runners
      # when every job downloads everything again (KI-040).
      - name: Maven repository cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/m2
          key: m2-gateway-emulator-${{ hashFiles('connectors/gateway-contract/drivers/java/pom-*.xml', 'connectors/gateway-contract/drivers/run.sh') }}
          restore-keys: m2-gateway-emulator-
      - name: Contract tests (ElasticMQ and moto)
        env:
          TABA_M2_DIR: ${{ runner.temp }}/m2
        run: connectors/gateway-contract/run.sh --target emulator

  taba:
    name: Scenarios on a Taba node
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Maven repository is kept between runs: Maven Central answers 429 (Too Many Requests) to the GitHub runners
      # when every job downloads everything again (KI-040).
      - name: Maven repository cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/m2
          key: m2-gateway-taba-${{ hashFiles('connectors/gateway-contract/drivers/java/pom-*.xml', 'connectors/gateway-contract/drivers/run.sh') }}
          restore-keys: m2-gateway-taba-
      - name: Contract tests (native SDKs against the gateway)
        env:
          TABA_M2_DIR: ${{ runner.temp }}/m2
        run: connectors/gateway-contract/run.sh
