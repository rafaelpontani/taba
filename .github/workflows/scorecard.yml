# OpenSSF Scorecard: an external, public score of the repository's security practices (pinned actions, minimal
# token permissions, branch protection, signed releases, dependency updates...). The result goes to the Security
# tab and to https://scorecard.dev/viewer/?uri=github.com/rafaelpontani/taba (the README badge).
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1"
  # Branch protection changes do not raise an event of their own.
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    # The score is only published for public repositories; while the repository is private the job is skipped.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
