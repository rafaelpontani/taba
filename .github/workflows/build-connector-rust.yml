# Build and tests of the Rust connector (taba-client and taba-cli), for x86_64 and arm64 on native runners. Called by
# ci.yml (branches and pull requests) and by release.yml, which passes the version computed by semantic-release.
# Uploads the static binary as the artifact `taba-cli-<arch>`, used by the CLI Docker image and the GitHub Release.
# Publishing the crates on crates.io is the `crates` job of release.yml.
name: Rust connector build

on:
  workflow_call:
    inputs:
      version:
        description: Release version (X.Y.Z or X.Y.Z-rc.N). Empty when there is no release.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # `taba-cli --version` shows the commit the binary was built from.
  TABA_GIT_SHA: ${{ github.sha }}

jobs:
  connector-rust:
    name: Rust connector (build and tests, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            triple: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            triple: aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: connectors/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        working-directory: .
        run: .github/scripts/set-version.sh "$VERSION"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: ${{ matrix.triple }}-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: connectors/rust
      - run: cargo fmt --all --check
        if: matrix.arch == 'amd64'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: matrix.arch == 'amd64'
      - run: cargo test --workspace --locked
      # What crates.io would receive: a package that compiles alone (without the path dependencies).
      - run: cargo package --workspace --locked --allow-dirty
        if: matrix.arch == 'amd64'
      # Static (musl) binary, for the Docker image and the release.
      - run: cargo build --release --locked -p taba-cli --target ${{ matrix.triple }}-unknown-linux-musl
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
      - name: Binary in dist
        env:
          TRIPLE: ${{ matrix.triple }}
          ARCH: ${{ matrix.arch }}
        working-directory: .
        run: |
          mkdir -p dist
          cp "connectors/rust/target/$TRIPLE-unknown-linux-musl/release/taba-cli" "dist/taba-cli-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: taba-cli-${{ matrix.arch }}
          path: dist/taba-cli-${{ matrix.arch }}
          retention-days: 1
