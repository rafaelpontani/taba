# Build and tests of the Rust connector (taba-cli), for x86_64 and arm64 on native runners. Called by ci.yml
# (pull request) and by release.yml, which passes the tag version. Uploads the static binary as the artifact
# `taba-cli-<arch>`, used by the CLI Docker image and the GitHub Release.
name: Rust connector build

on:
  workflow_call:
    inputs:
      version:
        description: Release version (X.Y.Z or X.Y.Z-rc.N). Empty on pull requests.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always


jobs:
  connector-rust:
    name: Rust connector (build and tests, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            triple: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            triple: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Release version
        if: inputs.version != ''
        run: .github/scripts/set-version.sh "${{ inputs.version }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.triple }}-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: connectors/rust
      - run: cargo fmt --all --check
        if: matrix.arch == 'amd64'
        working-directory: connectors/rust
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: matrix.arch == 'amd64'
        working-directory: connectors/rust
      - run: cargo test --workspace --locked
        working-directory: connectors/rust
      # Static (musl) binary, for the Docker image and the release.
      - run: cargo build --release --locked -p taba-cli --target ${{ matrix.triple }}-unknown-linux-musl
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        working-directory: connectors/rust
      - name: Binary in dist
        run: |
          mkdir -p dist
          cp "connectors/rust/target/${{ matrix.triple }}-unknown-linux-musl/release/taba-cli" "dist/taba-cli-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: taba-cli-${{ matrix.arch }}
          path: dist/taba-cli-${{ matrix.arch }}
          retention-days: 1
