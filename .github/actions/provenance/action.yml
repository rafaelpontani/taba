# Proof of origin of an image or OCI artifact, by digest: the GitHub attestation (SLSA provenance signed by Sigstore,
# checked with `gh attestation verify`) and the cosign keyless signature (OIDC of the workflow, in the public Rekor
# log, checked with `cosign verify`), both stored next to the artifact in the registry. One place for the pinned
# versions, used for every image and for the chart in release.yml. The job needs `id-token: write`,
# `attestations: write` and write access to the registry (already logged in).
name: Provenance and signature
description: Attests and signs an OCI artifact by digest.

inputs:
  subject-name:
    description: Repository of the artifact, without tag (for Docker Hub, index.docker.io/<user>/<repo>).
    required: true
  subject-digest:
    description: The sha256:... digest.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ inputs.subject-name }}
        subject-digest: ${{ inputs.subject-digest }}
        push-to-registry: true
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - shell: bash
      env:
        REF: ${{ inputs.subject-name }}@${{ inputs.subject-digest }}
      run: cosign sign --yes "$REF"
