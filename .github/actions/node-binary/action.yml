# Builds the `taba` binary (static, musl) into dist/taba-<arch>, for the Docker image and the release. The job
# that calls the action installs the target in the toolchain and the Cargo cache.
name: Node binary (musl)
description: Builds the static (musl) taba-node into dist/taba-<arch>.

inputs:
  target:
    description: Rust musl target (x86_64-unknown-linux-musl or aarch64-unknown-linux-musl).
    required: true
  arch:
    description: Architecture in the file name (amd64 or arm64), the same one Docker uses.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: sudo apt-get update && sudo apt-get install -y musl-tools
    - shell: bash
      env:
        RUSTFLAGS: "-C target-feature=+crt-static"
        TARGET: ${{ inputs.target }}
      run: cargo build --release --locked -p taba-node --target "$TARGET"
    - shell: bash
      env:
        TARGET: ${{ inputs.target }}
        ARCH: ${{ inputs.arch }}
      run: |
        mkdir -p dist
        cp "target/$TARGET/release/taba" "dist/taba-$ARCH"
