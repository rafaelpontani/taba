# Compila o binário `taba` (estático, musl) em `dist/taba`, para a imagem Docker. O job que chama a ação
# instala o target x86_64-unknown-linux-musl no toolchain e o cache do Cargo.
name: Binário do nó (musl)
description: Compila taba-node estático (musl) em dist/taba.

runs:
  using: composite
  steps:
    - shell: bash
      run: sudo apt-get update && sudo apt-get install -y musl-tools
    - shell: bash
      env:
        RUSTFLAGS: "-C target-feature=+crt-static"
      run: cargo build --release --locked -p taba-node --target x86_64-unknown-linux-musl
    - shell: bash
      run: |
        mkdir -p dist
        cp target/x86_64-unknown-linux-musl/release/taba dist/taba
