# Compila o binário `taba` (estático, musl) no runner Ubuntu e o deixa em `dist/taba`, para o Dockerfile.ci.
# O cache do Cargo (Swatinem/rust-cache) fica no runner, então um commit que muda só código reaproveita
# as dependências. O Dockerfile da raiz compila o mesmo binário do zero, dentro do container.
name: Binário do nó (musl)
description: Compila taba-node estático (musl) em dist/taba, com cache do Cargo.

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-musl
    - shell: bash
      run: sudo apt-get update && sudo apt-get install -y musl-tools
    - uses: Swatinem/rust-cache@v2
    - shell: bash
      env:
        RUSTFLAGS: "-C target-feature=+crt-static"
      run: cargo build --release --locked -p taba-node --target x86_64-unknown-linux-musl
    - shell: bash
      run: |
        mkdir -p dist
        cp target/x86_64-unknown-linux-musl/release/taba dist/taba
