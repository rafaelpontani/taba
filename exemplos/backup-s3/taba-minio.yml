# Backup opcional em S3 com MinIO (ou qualquer S3 compatível: Ceph, Garage, SeaweedFS…).
# É o arquivo de configuração do nó (`--config` ou TABA_CONFIG_FILE); cada chave também vale como
# variável de ambiente (`backup.s3.bucket` -> TABA_BACKUP_S3_BUCKET). Doc: doc/pt-BR/33-backup-s3.md.
#
# Só mostra o que o backup acrescenta; o resto da configuração do nó (portas, cluster, segredos) é a de
# sempre (doc/pt-BR/22-configuracao.md).

backup:
  s3:
    bucket: taba                    # ligar o recurso é só isto; sem bucket o backup não existe
    endpoint: http://minio:9000     # fora da AWS: o endereço do serviço (liga o path-style sozinho)
    access-key: taba                # as duas chaves vão juntas...
    secret-key: troque-esta-chave   # ...e nunca aparecem em log; prefira a variável TABA_BACKUP_S3_SECRET_KEY
    prefix: taba                    # a "pasta" no bucket; vários clusters podem dividir um bucket

  # Os padrões servem para a maioria; ajuste só com um motivo.
  delay: 60s            # a mensagem só sobe ao S3 depois disto: a consumida antes nunca vai
  meta:
    interval: 60s       # a defasagem (RPO) do estado das mensagens (entrega, invisibilidade, ack)
  heartbeat:
    interval: 15s       # de quanto em quanto tempo o nó diz ao bucket que está vivo
  dead-after: 60s       # sem batimento por este tempo, o nó é dado como morto (maior que heartbeat.interval)
  drain:
    timeout: 30s        # o quanto o drain e o flush esperam o S3; o prazo de parada do orquestrador deve
                        # passar de drain.timeout + este valor (o Compose do repositório usa 70 s)
  disk:
    evict-above: 85     # disco acima disto: apaga o corpo das mensagens que já estão no S3
    evict-to: 70
    pause-at: 90        # no flush e no drain, a passagem da memória para o disco pausa a este uso

# Parada: o orquestrador precisa esperar o envio ao S3.
drain:
  timeout: 25s
