# Example HAProxy for docker-compose.yml (decision D129). It is only a demonstration: Taba does not
# depend on it, and any load balancer works (nginx, Envoy, a cloud's, the Kubernetes Ingress), as long as
# it reaches the nodes' client port (applications) and cluster port (discovery).
global
    log stdout format raw local0
    maxconn 4096

# Docker's DNS. The nodes only exist after HAProxy (they need the `haproxy` name to start), so the
# names are resolved later, and a node that does not exist yet stays out of rotation.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 5s
    hold nx 1s

defaults
    log global
    timeout connect 3s
    timeout client  60s
    timeout server  60s

# Client API (HTTP). A node only enters rotation when it is ready (/health/ready, on the operations
# port).
frontend api
    bind *:8080
    mode http
    default_backend api_nodes

backend api_nodes
    mode http
    balance roundrobin
    option httpchk GET /health/ready
    http-check expect status 200
    default-server inter 2s fall 2 rise 1 port 9090 init-addr none resolvers docker
    server taba-0 taba-0:8080 check
    server-template taba 1-10 taba:8080 check

# Cluster port: only discovery (GET /cluster/nodes) goes through here, in plain TCP, without opening the
# mutual TLS (the client certificate must reach the node intact).
frontend cluster
    bind *:8081
    mode tcp
    default_backend cluster_nodes

backend cluster_nodes
    mode tcp
    balance roundrobin
    option httpchk GET /health/live
    http-check expect status 200
    default-server inter 2s fall 2 rise 1 port 9090 init-addr none resolvers docker
    server taba-0 taba-0:8081 check
    server-template taba 1-10 taba:8081 check
