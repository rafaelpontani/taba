# HAProxy de exemplo para o docker-compose.yml (decisão D129). É só uma demonstração: o Taba não
# depende dele, e qualquer balanceador serve (nginx, Envoy, o de uma nuvem, o Ingress do Kubernetes),
# desde que alcance a porta de cliente dos nós (aplicações) e a do cluster (descoberta).
global
    log stdout format raw local0
    maxconn 4096

# O DNS do Docker. Os nós só existem depois do HAProxy (eles precisam do nome `haproxy` para subir),
# então os nomes são resolvidos depois, e um nó que ainda não existe fica fora da rotação.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 5s
    hold nx 1s

defaults
    log global
    timeout connect 3s
    timeout client  60s
    timeout server  60s

# API de cliente (HTTP). Um nó só entra na rotação quando está pronto (/health/ready, na porta de
# operação).
frontend api
    bind *:8080
    mode http
    default_backend api_nodes

backend api_nodes
    mode http
    balance roundrobin
    option httpchk GET /health/ready
    http-check expect status 200
    default-server inter 2s fall 2 rise 1 port 9090 init-addr none resolvers docker
    server taba-1 taba-1:8080 check
    server taba-2 taba-2:8080 check
    server taba-3 taba-3:8080 check

# Porta do cluster: só a descoberta (GET /cluster/nodes) passa por aqui, e em TCP puro, sem abrir o
# TLS mútuo (o certificado do cliente precisa chegar intacto ao nó).
frontend cluster
    bind *:8081
    mode tcp
    default_backend cluster_nodes

backend cluster_nodes
    mode tcp
    balance roundrobin
    option httpchk GET /health/live
    http-check expect status 200
    default-server inter 2s fall 2 rise 1 port 9090 init-addr none resolvers docker
    server taba-1 taba-1:8081 check
    server taba-2 taba-2:8081 check
    server taba-3 taba-3:8081 check
