# UC-04: Ingress com host, classe, annotations e TLS.
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 6m
  hosts:
    - host: taba.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: taba-tls
      hosts: [taba.example.com]
persistence:
  size: 1Gi
