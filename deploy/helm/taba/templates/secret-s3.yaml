{{- if and (not .Values.seaweedfs.enabled) .Values.backup.s3.bucket (not .Values.backup.s3.existingSecret) .Values.backup.s3.accessKey }}
{{- if not .Values.backup.s3.secretKey }}{{ fail "backup.s3.accessKey e secretKey andam em par" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taba.fullname" . }}-s3
  labels:
    {{- include "taba.labels" . | nindent 4 }}
type: Opaque
stringData:
  accessKey: {{ .Values.backup.s3.accessKey | quote }}
  secretKey: {{ .Values.backup.s3.secretKey | quote }}
{{- end }}
