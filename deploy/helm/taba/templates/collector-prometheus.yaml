{{- if eq .Values.collector.type "prometheus" }}
{{- $fn := include "taba.fullname" . }}
{{- $p := .Values.collector.prometheus }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fn }}-prometheus
  labels:
    {{- include "taba.componentLabels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
---
# Descoberta de pods só no namespace do release.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fn }}-prometheus
  labels:
    {{- include "taba.componentLabels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fn }}-prometheus
  labels:
    {{- include "taba.componentLabels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $fn }}-prometheus }
subjects:
  - { kind: ServiceAccount, name: {{ $fn }}-prometheus, namespace: {{ .Release.Namespace }} }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-prometheus
  labels:
    {{- include "taba.componentLabels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ $p.scrapeInterval }}
    scrape_configs:
      - job_name: taba
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace }}]
        metrics_path: /metrics
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance, __meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: {{ .Release.Name }};node
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: ops
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      {{- with $p.extraScrapeConfigs }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- with $p.remoteWrite }}
    remote_write:
      {{- toYaml . | nindent 6 }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-prometheus
  labels:
    {{- include "taba.componentLabels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "taba.componentSelector" (dict "ctx" . "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "taba.componentSelector" (dict "ctx" . "component" "prometheus") | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml (dict "s" $p.scrapeInterval "e" $p.extraScrapeConfigs "r" $p.remoteWrite) | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ $fn }}-prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: {{ $p.image.repository }}:{{ $p.image.tag }}
          imagePullPolicy: {{ $p.image.pullPolicy }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $p.retention }}
            - --web.enable-lifecycle
          ports:
            - { name: web, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /-/ready, port: web }
          {{- with $p.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap:
            name: {{ $fn }}-prometheus
        - name: data
          {{- if $p.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $fn }}-prometheus
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-prometheus
  labels:
    {{- include "taba.componentLabels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
spec:
  ports:
    - { name: web, port: 9090, targetPort: web }
  selector:
    {{- include "taba.componentSelector" (dict "ctx" . "component" "prometheus") | nindent 4 }}
{{- if $p.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fn }}-prometheus
  labels:
    {{- include "taba.componentLabels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if $p.persistence.storageClass }}
  storageClassName: {{ if eq $p.persistence.storageClass "-" }}""{{ else }}{{ $p.persistence.storageClass }}{{ end }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.persistence.size }}
{{- end }}
{{- end }}
