{{- if and (not (include "taba.isDev" .)) (not .Values.secrets.existingSecret) }}
{{- $name := include "taba.secretsName" . }}
{{- $hook := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" }}
# Gera, UMA vez, o Secret com o root token e o certificado do cluster (`taba init`). Roda antes de instalar e
# antes de atualizar, mas é idempotente: se o Secret já existe, não faz nada (nunca troca o certificado).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "taba.fullname" . }}-init
  labels:
    {{- include "taba.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-10") $hook) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "taba.fullname" . }}-init
  labels:
    {{- include "taba.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-10") $hook) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "taba.fullname" . }}-init
  labels:
    {{- include "taba.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-9") $hook) | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "taba.fullname" . }}-init }
subjects:
  - { kind: ServiceAccount, name: {{ include "taba.fullname" . }}-init }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "taba.fullname" . }}-init
  labels:
    {{- include "taba.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "0") $hook) | nindent 4 }}
spec:
  backoffLimit: {{ .Values.secrets.init.backoffLimit }}
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "taba.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "taba.fullname" . }}-init
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        - name: generate
          image: {{ include "taba.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - taba init --out /out/secrets --days {{ .Values.secrets.init.certDays }}
          volumeMounts:
            - { name: out, mountPath: /out }
      containers:
        - name: apply
          image: {{ .Values.secrets.init.kubectlImage }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if kubectl get secret {{ $name }} >/dev/null 2>&1; then
                echo "Secret {{ $name }} já existe: nada a fazer"; exit 0
              fi
              crt=$(ls /out/secrets/tls/*.crt | head -n1)
              kubectl create secret generic {{ $name }} \
                --from-file=root-token=/out/secrets/root-token \
                --from-file=tls.crt="$crt" --from-file=tls.key="${crt%.crt}.key"
              kubectl label secret {{ $name }} app.kubernetes.io/instance={{ .Release.Name }} app.kubernetes.io/name={{ include "taba.name" . }} --overwrite
          volumeMounts:
            - { name: out, mountPath: /out, readOnly: true }
      volumes:
        - name: out
          emptyDir: {}
{{- end }}
