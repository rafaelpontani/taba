[workspace]
resolver = "3"
members = ["crates/taba-node"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/rafaelpontani/taba"

[profile.dev]
# Só as tabelas de linha: com os símbolos completos cada binário de teste ocupava centenas de MB
# e o `target/` enchia o disco.
debug = "line-tables-only"
