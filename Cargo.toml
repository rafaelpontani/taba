[workspace]
resolver = "3"
members = ["crates/taba-node"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/rafaelpontani/taba"

[profile.dev]
# Line tables only: with full symbols each test binary took hundreds of MB
# and `target/` filled the disk.
debug = "line-tables-only"
