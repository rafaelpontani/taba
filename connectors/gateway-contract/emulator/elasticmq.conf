# ElasticMQ for the gateway contract tests: the queue URLs carry the name of the container, which is how the other
# containers reach it (the SDK of Node uses the QueueUrl as the endpoint).
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}
