# Known vulnerabilities that the OSV scanner (and the OpenSSF Scorecard check Vulnerabilities) must not count here.
# Decision D227 (doc/en-US/30-decisions.md). This is the variant old of the driver: the AWS SDK for JavaScript 3.445.0
# on purpose (an SDK from before the switch from the Query protocol), whose packages ask for versions that have no fix
# in their major line. What has a compatible fix is taken in package.json (overrides: fast-xml-parser 4.5.5). The driver
# only runs in the gateway contract tests, against a local node; nothing of it is published. Review on the date below:
# drop an entry when the advisory no longer applies, or extend the date if the reason still holds.

