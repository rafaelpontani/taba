name: Taba
driverClass: io.github.rafaelpontani.taba.omb.TabaBenchmarkDriver

# Address of the client API (the load balancer in front of the cluster) and its token ("" = no header).
baseUrl: http://localhost:8080
token: ""

# none: ordinary queue, the message key (if any) is the groupId (fair delivery, no order).
# per-key: FIFO queue, the key is the group; without a key the producer rotates p0..p<partitions-1>.
ordering: none

producer:
  inFlight: 1000

consumer:
  waitTime: 20
  maxMessages: 100
  visibilityTimeout: 60
