[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taba-client"
dynamic = ["version"]
description = "Taba messaging system client: the nine operations, subscribe, call retries. No dependencies."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
keywords = ["taba", "queue", "messaging", "client"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/rafaelpontani/taba"

[tool.setuptools]
packages = ["taba"]

[tool.setuptools.dynamic]
version = { attr = "taba._version.VERSION" }

[tool.setuptools.package-data]
taba = ["py.typed"]
