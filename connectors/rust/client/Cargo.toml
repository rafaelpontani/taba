[package]
name = "taba-client"
description = "The Taba Rust connector: its own HTTP/1.1, TLS through rustls and a minimal JSON reader."
version = "0.1.0"
edition = "2021"
license.workspace = true
# The Apache-2.0 text lives once, in connectors/LICENSE; cargo copies it into the published crate.
license-file = "../../LICENSE"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
readme = "README.md"
documentation = "https://docs.rs/taba-client"
categories = ["network-programming", "api-bindings"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[features]
# `publish_object` and `consume_typed`: serialize and deserialize the body with serde (D140).
serde = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
