# The Rust connectors (`taba-client` and `taba-cli`) form their own workspace, outside the
# server workspace: they share neither dependencies nor the Rust version with it (doc/pt-BR/21-conectores.md).
[workspace]
resolver = "2"
members = ["client", "cli"]

[workspace.package]
edition = "2021"
# The connectors are Apache-2.0 so any application can embed them; the server stays AGPL-3.0-only (D164).
license = "Apache-2.0"
repository = "https://github.com/rafaelpontani/taba"
homepage = "https://github.com/rafaelpontani/taba"
keywords = ["taba", "queue", "messaging", "client"]

[profile.dev]
# Line tables only: with full symbols each test binary took hundreds of MB.
debug = "line-tables-only"
