confirm.drain.title: "Drain the node?"
confirm.drain.body: "Node %{node} will write everything in memory to disk, stop taking requests and leave the cluster. The process keeps running as drained; you can return the node later."
confirm.return.title: "Return the node?"
confirm.return.body: "Node %{node} will come back to the cluster as a new node: a new id, a full bootstrap, recovering what was lost meanwhile."
confirm.flush-node.title: "Flush the backup of this node?"
confirm.flush-node.body: "Node %{node} will move memory to disk and send segments and journals to S3. It is safe in production: the node keeps running."
confirm.flush-all.title: "Flush the backup of every node?"
confirm.flush-all.body: "Every node will move memory to disk and send segments and journals to S3. A slow or unreachable node is reported, and you can repeat the flush."
confirm.stop.title: "Stop the cluster?"
confirm.stop.body: "Every node will be drained with its backup sent. The processes keep running as drained: stopping them is up to your orchestrator. Clients are refused until the nodes return."

