condition.write-quorum-at-risk: "write quorum at risk"
condition.write-quorum-at-risk.meaning: "One more node failure and writes would lose their quorum."
condition.write-quorum-at-risk.action: "Bring the missing node back, or add capacity, before another one fails."
condition.quorum-lost: "quorum lost"
condition.quorum-lost.meaning: "Too few nodes are reachable: writes are being refused."
condition.quorum-lost.action: "Restore the unreachable nodes now. Check their processes and the network between them."
condition.membership-divergent: "membership divergent"
condition.membership-divergent.meaning: "The nodes disagree about who is in the cluster."
condition.membership-divergent.action: "Wait a few seconds. If it persists, compare the members table version of each node and restart the one that is behind."
condition.member-unreachable: "member unreachable"
condition.member-unreachable.meaning: "A member of the cluster does not answer."
condition.member-unreachable.action: "Check that its process is running and that its cluster port is reachable."
condition.node-frozen: "node frozen"
condition.node-frozen.meaning: "A node was excluded from the cluster and no longer takes part in it."
condition.node-frozen.action: "Return it (it comes back as a new node) or replace it."
condition.syncing: "syncing"
condition.syncing.meaning: "A node is catching up with the cluster's data."
condition.syncing.action: "Wait for it to finish, and avoid draining other nodes meanwhile."
condition.under-replicated: "under-replicated"
condition.under-replicated.meaning: "Some blocks have fewer copies than configured."
condition.under-replicated.action: "Wait for the sync. If it persists, check the free disk space and the channels between the nodes."
condition.storage-pressure: "storage pressure"
condition.storage-pressure.meaning: "A node is short on disk space."
condition.storage-pressure.action: "Free or add disk space on that node before it stops accepting messages."

