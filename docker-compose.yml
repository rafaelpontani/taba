# A complete Taba cluster: nodes behind an example HAProxy (decision D129).
#
#   docker compose up -d                starts everything with the public Docker Hub images (rafaelpontani/taba);
#                                       the first node forms the cluster and the others join. The tag comes from
#                                       TABA_VERSION (default: rc), for example: TABA_VERSION=1.2 docker compose up -d
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d
#                                       the same cluster, but building the images from this repository
#                                       (for developers; see docker-compose.dev.yml)
#   docker compose ps                   the nodes turn "healthy" when they finish syncing
#   docker compose run --rm taba-cli health cluster -o table
#
# The optional S3 backup (doc/pt-BR/33-backup-s3.md) is already on, in a SeaweedFS that starts alongside. In
# production the bucket would be the cloud's S3 (or a Kubernetes Service): change the TABA_BACKUP_S3_*
# variables below (AWS needs no endpoint or keys, only a bucket and a region). To run without backup, delete
# these variables and the `seaweedfs` and `seaweedfs-init` services.
#
# The client API is at http://localhost:8080 (HAProxy). The root token is in the `secrets` volume:
#   docker compose run --rm --entrypoint cat taba-cli /secrets/root-token
#
# To tear down and delete the data: docker compose down -v

x-taba: &taba
  # Public image. The local build lives in docker-compose.dev.yml.
  image: rafaelpontani/taba:${TABA_VERSION:-rc}
  # Greater than drain.timeout (25 s) + backup.drain.timeout (30 s), so the node finishes the drain, and
  # the upload to S3, before the SIGKILL.
  stop_grace_period: 70s
  volumes:
    - secrets:/etc/taba/secrets:ro
  environment: &taba-env
    # Dedicated port for the operations routes (health, metrics, drain); internal network only.
    TABA_OPERATIONS_PORT: "9090"
    # Discovery goes through HAProxy, on the cluster port.
    TABA_CLUSTER_ENTRY_ADDRESS: haproxy:8081
    TABA_REPLICATION_FACTOR: "3"
    # Colored text logs in `docker compose logs` (node default: `text`; `json` is also available).
    TABA_TELEMETRY_LOGS_FORMAT: color
    # S3 backup (the example's SeaweedFS). Demo credentials: change them in any real use.
    TABA_BACKUP_S3_BUCKET: taba
    TABA_BACKUP_S3_ENDPOINT: http://seaweedfs:8333
    TABA_BACKUP_S3_ACCESS_KEY: taba
    TABA_BACKUP_S3_SECRET_KEY: taba-s3-secret
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/health/ready"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 5s

services:
  # Creates the secrets folder (cluster certificate and root token) once; on later runs it does
  # nothing. Runs as root only to write to the new volume and hand the files to the node's user.
  init:
    image: rafaelpontani/taba:${TABA_VERSION:-rc}
    user: "0"
    entrypoint: ["sh", "-c"]
    command:
      - |
        test -f /secrets/root-token || taba init --out /secrets
        chown -R 10001:10001 /secrets
    volumes:
      - secrets:/secrets
    restart: "no"

  taba-0:
    <<: *taba
    hostname: taba-0
    depends_on:
      init:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
      haproxy:
        condition: service_started
    environment:
      <<: *taba-env
      # Only the first node of a new cluster starts the cluster by itself.
      TABA_CLUSTER_FIRST_NODE: "true"
    volumes:
      - secrets:/etc/taba/secrets:ro
      - data-0:/var/lib/taba

  # The other nodes: replicas of the same service, which join the cluster formed by taba-0. Three by default
  # (four nodes in total, counting taba-0); for more, `docker compose up -d --scale taba=4`. HAProxy
  # discovers the replicas through DNS. Each replica has its own data volume (anonymous: Compose does not
  # create a named volume per replica), which `docker compose down -v` deletes. To stop or kill one
  # particular node, use `docker/cluster.sh stop|kill|start taba-2` (taba-N is replica N; the seed is
  # taba-0) or `docker stop <container>`.
  taba:
    <<: *taba
    deploy:
      replicas: 3
    depends_on:
      haproxy:
        condition: service_started
      taba-0:
        condition: service_healthy
    volumes:
      - secrets:/etc/taba/secrets:ro
      - /var/lib/taba

  # The example's S3 (SeaweedFS: master, volume server, filer and S3 gateway in one process). In production: the
  # cloud's S3. The backup needs an S3 that honors conditional writes (If-None-Match / If-Match), which
  # SeaweedFS does (Garage does not). Cluster UI at http://localhost:9333. S3 key: taba / taba-s3-secret.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"taba","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.config=/tmp/s3.json -s3.port=8333 -master.volumeSizeLimitMB=1024 -volume.max=20
    environment:
      S3_ACCESS_KEY: taba
      S3_SECRET_KEY: taba-s3-secret
    ports:
      - "9333:9333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s

  # Creates the backup bucket once; on later runs it does nothing (same image: `weed shell`).
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 | grep -qw taba || echo "s3.bucket.create -name taba" | weed shell -master=seaweedfs:9333
    restart: "no"

  haproxy:
    image: haproxy:lts-alpine
    volumes:
      - ./docker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8080:8080"

  # The client command line, already pointed at the cluster. It only runs on demand:
  #   docker compose run --rm taba-cli topic list
  taba-cli:
    image: rafaelpontani/taba-cli:${TABA_VERSION:-rc}
    profiles: ["tools"]
    environment:
      TABA_CLI_URL: http://haproxy:8080
      # The operations routes do not go through HAProxy; this profile talks to the first node.
      TABA_CLI_OPS_URL: http://taba-0:9090
      TABA_CLI_TOKEN_FILE: /secrets/root-token
    volumes:
      - secrets:/secrets:ro
    depends_on:
      - haproxy

volumes:
  secrets:
  seaweedfs-data:
  data-0:
