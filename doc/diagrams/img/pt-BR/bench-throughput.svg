<text class="ax" x="20" y="346">Mesmos limites para todos: 1 nó 4 núcleos / 3 GB · 3 nós 2 núcleos / 1536 MB cada · durabilidade: fsync</text>
<text class="ax" x="20" y="364">NATS JetStream: falha acima de ~380 msg/s, um fsync por mensagem (sync_interval: always) trava o servidor e o cliente desiste depois de 2 s</text>
