<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" width="1080" height="700" role="img" lang="pt-BR" aria-labelledby="t d" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
<title id="t">Anel de hash circular: blocos e papéis</title>
<desc id="d">Anel com 12 posições de 4 nós físicos. Duas mensagens caem em pontos do anel e, andando no sentido horário, o primeiro nó virtual é o primário, seguido do secundário e do terciário, pulando nós virtuais de um nó físico já escolhido.</desc>
<rect width="1080" height="700" fill="#020617"/>
<text x="40" y="44" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="start">Anel de hash circular: blocos e papéis</text><text x="40" y="66" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">cluster de 4 nós físicos, cada um em 3 posições do anel (nós virtuais), fator de replicação 3</text><circle cx="350" cy="336" r="200" fill="none" stroke="#334155" stroke-width="3"/><text x="350" y="330" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">sentido horário</text><text x="350" y="350" font-size="26" font-weight="400" fill="#94a3b8" text-anchor="middle">↻</text><path d="M543.19 387.76 A200 200 0 0 1 250 509.21" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round" opacity="0.4"/><path d="M156.81 387.76 A200 200 0 0 1 250 162.79" fill="none" stroke="#60a5fa" stroke-width="9" stroke-linecap="round" opacity="0.4"/><circle cx="350" cy="136" r="24" fill="#0b2a35" stroke="#22d3ee" stroke-width="2.5"/><text x="350" y="141" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">A1</text><circle cx="450" cy="162.79" r="24" fill="#33260a" stroke="#fbbf24" stroke-width="2.5"/><text x="450" y="167.79" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">C1</text><circle cx="523.21" cy="236" r="24" fill="#241a4a" stroke="#a78bfa" stroke-width="2.5"/><text x="523.21" y="241" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">B1</text><circle cx="550" cy="336" r="24" fill="#3a121e" stroke="#fb7185" stroke-width="2.5"/><text x="550" y="341" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">D1</text><circle cx="523.21" cy="436" r="24" fill="#0b2a35" stroke="#22d3ee" stroke-width="2.5"/><text x="523.21" y="441" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">A2</text><circle cx="450" cy="509.21" r="24" fill="#0b2a35" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="4 3"/><text x="450" y="514.21" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">A3</text><line x1="433" y1="526.21" x2="467" y2="492.21" stroke="#22d3ee" stroke-width="2.5"/><circle cx="350" cy="536" r="24" fill="#33260a" stroke="#fbbf24" stroke-width="2.5"/><text x="350" y="541" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">C2</text><circle cx="250" cy="509.21" r="24" fill="#241a4a" stroke="#a78bfa" stroke-width="2.5"/><text x="250" y="514.21" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">B2</text><circle cx="176.79" cy="436" r="24" fill="#3a121e" stroke="#fb7185" stroke-width="2.5"/><text x="176.79" y="441" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">D2</text><circle cx="150" cy="336" r="24" fill="#241a4a" stroke="#a78bfa" stroke-width="2.5"/><text x="150" y="341" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">B3</text><circle cx="176.79" cy="236" r="24" fill="#33260a" stroke="#fbbf24" stroke-width="2.5"/><text x="176.79" y="241" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">C3</text><circle cx="250" cy="162.79" r="24" fill="#3a121e" stroke="#fb7185" stroke-width="2.5"/><text x="250" y="167.79" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">D3</text><path d="M543.19 378.76 L552.19 387.76 L543.19 396.76 L534.19 387.76 Z" fill="#34d399" stroke="#020617" stroke-width="2"/><text x="502.62" y="374.89" font-size="15" font-weight="700" fill="#34d399" text-anchor="middle">m1</text><text x="502.62" y="389.89" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="middle">hash(ID)</text><rect x="543.7" y="452" width="56" height="24" rx="12" fill="#34d399" stroke="#34d399" stroke-width="2"/><text x="571.7" y="468.5" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">m1 P</text><rect x="432" y="545.7" width="92" height="24" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/><text x="478" y="562.2" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">m1 pulado</text><rect x="322" y="580" width="56" height="24" rx="12" fill="#020617" stroke="#34d399" stroke-width="2"/><text x="350" y="596.5" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">m1 S</text><rect x="194" y="545.7" width="56" height="24" rx="12" fill="#020617" stroke="#34d399" stroke-width="2"/><text x="222" y="562.2" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">m1 T</text><path d="M156.81 378.76 L165.81 387.76 L156.81 396.76 L147.81 387.76 Z" fill="#60a5fa" stroke="#020617" stroke-width="2"/><text x="197.38" y="374.89" font-size="15" font-weight="700" fill="#60a5fa" text-anchor="middle">m2</text><text x="197.38" y="389.89" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="middle">hash(ID)</text><rect x="66" y="324" width="56" height="24" rx="12" fill="#60a5fa" stroke="#60a5fa" stroke-width="2"/><text x="94" y="340.5" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">m2 P</text><rect x="100.3" y="196" width="56" height="24" rx="12" fill="#020617" stroke="#60a5fa" stroke-width="2"/><text x="128.3" y="212.5" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">m2 S</text><rect x="194" y="102.3" width="56" height="24" rx="12" fill="#020617" stroke="#60a5fa" stroke-width="2"/><text x="222" y="118.8" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">m2 T</text><line x1="676" y1="96" x2="676" y2="660" stroke="#334155" stroke-width="1.5"/><text x="700" y="112" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="start">Como ler o anel</text><circle cx="710" cy="134" r="10" fill="#f8fafc"/><text x="710" y="138" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">1</text><text x="732" y="138" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">The message ID becomes a hash: a point</text><text x="732" y="155" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">on the ring (diamond).</text><circle cx="710" cy="180" r="10" fill="#f8fafc"/><text x="710" y="184" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">2</text><text x="732" y="184" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">Walking clockwise, the first virtual</text><text x="732" y="201" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">node is the primary (P): the owner of</text><text x="732" y="218" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">delivery.</text><circle cx="710" cy="243" r="10" fill="#f8fafc"/><text x="710" y="247" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">3</text><text x="732" y="247" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">The next physical nodes not used yet are</text><text x="732" y="264" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">the secondary (S) and the tertiary (T),</text><text x="732" y="281" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">until the replication factor is met.</text><circle cx="710" cy="306" r="10" fill="#f8fafc"/><text x="710" y="310" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">4</text><text x="732" y="310" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">A virtual node of an already chosen</text><text x="732" y="327" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">physical node is skipped: replicas</text><text x="732" y="344" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">always sit on different machines.</text><circle cx="710" cy="369" r="10" fill="#f8fafc"/><text x="710" y="373" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">5</text><text x="732" y="373" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">Each physical node holds several</text><text x="732" y="390" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">positions, so it gets blocks spread</text><text x="732" y="407" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">around the ring, not one continuous</text><text x="732" y="424" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">stretch.</text><text x="700" y="459" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="start">Resultado dos dois exemplos</text><text x="700" y="487" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="start"></text><text x="796" y="487" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">P</text><text x="886" y="487" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">S</text><text x="976" y="487" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">T</text><rect x="694" y="495" width="352" height="34" rx="8" fill="#0b1220" stroke="#334155"/><text x="706" y="517" font-size="13" font-weight="700" fill="#34d399" text-anchor="start">m1</text><circle cx="796" cy="512" r="12" fill="#0b2a35" stroke="#22d3ee" stroke-width="2"/><text x="796" y="516.5" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">A</text><circle cx="886" cy="512" r="12" fill="#33260a" stroke="#fbbf24" stroke-width="2"/><text x="886" y="516.5" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">C</text><circle cx="976" cy="512" r="12" fill="#241a4a" stroke="#a78bfa" stroke-width="2"/><text x="976" y="516.5" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">B</text><rect x="694" y="537" width="352" height="34" rx="8" fill="#0b1220" stroke="#334155"/><text x="706" y="559" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="start">m2</text><circle cx="796" cy="554" r="12" fill="#241a4a" stroke="#a78bfa" stroke-width="2"/><text x="796" y="558.5" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">B</text><circle cx="886" cy="554" r="12" fill="#33260a" stroke="#fbbf24" stroke-width="2"/><text x="886" y="558.5" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">C</text><circle cx="976" cy="554" r="12" fill="#3a121e" stroke="#fb7185" stroke-width="2"/><text x="976" y="558.5" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">D</text><text x="700" y="593" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">Different blocks have different primaries:</text><text x="700" y="610" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">m1 is owned by A; m2 by B.</text><text x="40" y="662" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="start">Nós físicos</text><circle cx="150" cy="658" r="11" fill="#0b2a35" stroke="#22d3ee" stroke-width="2"/><text x="150" y="662.5" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">A</text><circle cx="220" cy="658" r="11" fill="#241a4a" stroke="#a78bfa" stroke-width="2"/><text x="220" y="662.5" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">B</text><circle cx="290" cy="658" r="11" fill="#33260a" stroke="#fbbf24" stroke-width="2"/><text x="290" y="662.5" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">C</text><circle cx="360" cy="658" r="11" fill="#3a121e" stroke="#fb7185" stroke-width="2"/><text x="360" y="662.5" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">D</text><text x="450" y="662" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">A1, A2, A3: nós virtuais do nó físico A</text>
</svg>
