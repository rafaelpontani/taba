<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" width="1080" height="660" role="img" lang="pt-BR" aria-labelledby="t d" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
<title id="t">Os grupos de uma fila FIFO no anel</title>
<desc id="d">Matriz com os grupos g1 a g4 da fila pedidos-fifo nas linhas e os nós A, B, C e D nas colunas. Cada grupo tem um primário, um secundário e um terciário, e todas as mensagens de um grupo ficam nos mesmos nós.</desc>
<rect width="1080" height="660" fill="#020617"/>
<text x="40" y="44" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="start">Os grupos de uma fila FIFO no anel</text><text x="40" y="66" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">fila `pedidos-fifo`: 4 grupos em 4 nós, fator de replicação 3; o grupo decide o bloco, e não o ID da mensagem</text><text x="60" y="124" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="start">grupo</text><circle cx="259" cy="116" r="15" fill="#0b2a35" stroke="#22d3ee" stroke-width="2.5"/><text x="259" y="121" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">A</text><circle cx="377" cy="116" r="15" fill="#241a4a" stroke="#a78bfa" stroke-width="2.5"/><text x="377" y="121" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">B</text><circle cx="495" cy="116" r="15" fill="#33260a" stroke="#fbbf24" stroke-width="2.5"/><text x="495" y="121" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">C</text><circle cx="613" cy="116" r="15" fill="#3a121e" stroke="#fb7185" stroke-width="2.5"/><text x="613" y="121" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">D</text><rect x="40" y="144" width="642" height="48" rx="10" fill="#0b1220"/><text x="60" y="168" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="start">g1</text><text x="60" y="184" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">m1 → m3 → m5</text><rect x="213" y="150" width="92" height="38" rx="9" fill="#22d3ee" stroke="#22d3ee" stroke-width="2.5"/><text x="259" y="174" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">P</text><rect x="331" y="150" width="92" height="38" rx="9" fill="#020617" stroke="#a78bfa" stroke-width="2.5"/><text x="377" y="174" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">T</text><rect x="449" y="150" width="92" height="38" rx="9" fill="#33260a" stroke="#fbbf24" stroke-width="2.5"/><text x="495" y="174" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">S</text><rect x="567" y="150" width="92" height="38" rx="9" fill="none" stroke="#334155" stroke-dasharray="3 4"/><rect x="40" y="198" width="642" height="48" rx="10" fill="none"/><text x="60" y="222" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="start">g2</text><text x="60" y="238" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">m2 → m4</text><rect x="213" y="204" width="92" height="38" rx="9" fill="none" stroke="#334155" stroke-dasharray="3 4"/><rect x="331" y="204" width="92" height="38" rx="9" fill="#a78bfa" stroke="#a78bfa" stroke-width="2.5"/><text x="377" y="228" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">P</text><rect x="449" y="204" width="92" height="38" rx="9" fill="#33260a" stroke="#fbbf24" stroke-width="2.5"/><text x="495" y="228" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">S</text><rect x="567" y="204" width="92" height="38" rx="9" fill="#020617" stroke="#fb7185" stroke-width="2.5"/><text x="613" y="228" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">T</text><rect x="40" y="252" width="642" height="48" rx="10" fill="#0b1220"/><text x="60" y="276" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="start">g3</text><text x="60" y="292" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">m6</text><rect x="213" y="258" width="92" height="38" rx="9" fill="#020617" stroke="#22d3ee" stroke-width="2.5"/><text x="259" y="282" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">T</text><rect x="331" y="258" width="92" height="38" rx="9" fill="none" stroke="#334155" stroke-dasharray="3 4"/><rect x="449" y="258" width="92" height="38" rx="9" fill="#fbbf24" stroke="#fbbf24" stroke-width="2.5"/><text x="495" y="282" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">P</text><rect x="567" y="258" width="92" height="38" rx="9" fill="#3a121e" stroke="#fb7185" stroke-width="2.5"/><text x="613" y="282" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">S</text><rect x="40" y="306" width="642" height="48" rx="10" fill="none"/><text x="60" y="330" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="start">g4</text><text x="60" y="346" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">m7 → m8</text><rect x="213" y="312" width="92" height="38" rx="9" fill="#0b2a35" stroke="#22d3ee" stroke-width="2.5"/><text x="259" y="336" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">S</text><rect x="331" y="312" width="92" height="38" rx="9" fill="none" stroke="#334155" stroke-dasharray="3 4"/><rect x="449" y="312" width="92" height="38" rx="9" fill="#020617" stroke="#fbbf24" stroke-width="2.5"/><text x="495" y="336" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">T</text><rect x="567" y="312" width="92" height="38" rx="9" fill="#fb7185" stroke="#fb7185" stroke-width="2.5"/><text x="613" y="336" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">P</text><line x1="40" y1="372" x2="682" y2="372" stroke="#334155" stroke-width="1.5"/><text x="60" y="396" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="start">cada nó é primário de</text><text x="259" y="394" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">1 grupo</text><text x="259" y="412" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">1P 1S 1T</text><text x="377" y="394" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">1 grupo</text><text x="377" y="412" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">1P 0S 1T</text><text x="495" y="394" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">1 grupo</text><text x="495" y="412" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">1P 2S 1T</text><text x="613" y="394" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">1 grupo</text><text x="613" y="412" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">1P 1S 1T</text><rect x="60" y="436" width="30" height="22" rx="6" fill="#94a3b8" stroke="#94a3b8" stroke-width="2"/><text x="75" y="452" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">P</text><text x="100" y="452" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">primário: ordena e entrega</text><rect x="290" y="436" width="30" height="22" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/><text x="305" y="452" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">S</text><text x="330" y="452" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">secundário: no quórum</text><rect x="510" y="436" width="30" height="22" rx="6" fill="#020617" stroke="#94a3b8" stroke-width="2"/><text x="525" y="452" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">T</text><text x="550" y="452" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">terciário</text><rect x="770" y="112" width="270" height="179" rx="12" fill="#0b1220" stroke="#334155"/><circle cx="790" cy="136" r="6" fill="#22d3ee"/><text x="804" y="141" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="start">Um grupo, um bloco</text><text x="790" y="164" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• The hash of the topic id plus the</text><text x="790" y="181" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  groupId decides the block: all</text><text x="790" y="198" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  messages of the group stay on the</text><text x="790" y="215" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  same 3 nodes.</text><text x="790" y="240" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• The primary generates the IDs in</text><text x="790" y="257" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  increasing order and delivers one</text><text x="790" y="274" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  message of the group at a time.</text><rect x="770" y="307" width="270" height="145" rx="12" fill="#0b1220" stroke="#334155"/><circle cx="790" cy="331" r="6" fill="#34d399"/><text x="804" y="336" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="start">Espalhado entre grupos</text><text x="790" y="359" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• Different groups land in</text><text x="790" y="376" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  different blocks: the primaries</text><text x="790" y="393" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  take turns.</text><text x="790" y="418" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• A big group never goes beyond one</text><text x="790" y="435" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  primary (hot group).</text><rect x="770" y="468" width="270" height="162" rx="12" fill="#0b1220" stroke="#334155"/><circle cx="790" cy="492" r="6" fill="#fb7185"/><text x="804" y="497" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="start">Se o primário de g1 cair</text><text x="790" y="520" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• Secondary C takes over g1 already</text><text x="790" y="537" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  up to date, since the quorum</text><text x="790" y="554" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  always included it.</text><text x="790" y="579" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• The order of g1 and the</text><text x="790" y="596" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  deduplication carry on without</text><text x="790" y="613" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  loss.</text>
</svg>
