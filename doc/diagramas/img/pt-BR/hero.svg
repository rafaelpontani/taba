<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" lang="pt-BR" aria-labelledby="t d">
<title id="t">Taba: mensageria open source que substitui SQS, SNS, Kafka e RabbitMQ com uma só imagem Docker</title>
<desc id="d">Cluster de 3 nós, todos com a mesma imagem, desenhados como prédios de 3 andares. Vários produtores entram e saem e publicam mensagens; cada mensagem tem um nó primário, que a replica nos outros dois, e todo nó é o primário de parte delas. Consumidores chegam depois, leem as mensagens de forma assíncrona e confirmam com ack, e a mensagem sai dos 3 nós.</desc>
<rect width="1200" height="540" fill="#020617"/><text x="60" y="84" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="700" fill="#22d3ee" text-anchor="start">MENSAGERIA OPEN SOURCE · AGPLv3</text><path d="M96 120.65 L129 183.35 L63 183.35 Z" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linejoin="round"/><text x="150" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="112" font-weight="800" fill="#f8fafc" text-anchor="start">Taba</text><text x="60" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#f8fafc" text-anchor="start">Substitua SQS, SNS, Kafka</text><text x="60" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#f8fafc">e RabbitMQ com <tspan fill="#22d3ee">uma só imagem.</tspan></text><text x="60" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" text-anchor="start">Velocidade e disponibilidade, com custo</text><text x="60" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" text-anchor="start">quase zero. Sem nuvem obrigatória.</text><rect x="60" y="430" width="212" height="42" rx="21" fill="#0b1220" stroke="#334155" stroke-width="1.5"/><text x="166" y="457" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#f8fafc" text-anchor="middle">1 imagem Docker</text><rect x="288" y="430" width="128" height="42" rx="21" fill="#0b1220" stroke="#334155" stroke-width="1.5"/><text x="352" y="457" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#f8fafc" text-anchor="middle">API HTTP</text><rect x="432" y="430" width="212" height="42" rx="21" fill="#0b1220" stroke="#334155" stroke-width="1.5"/><text x="538" y="457" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#f8fafc" text-anchor="middle">sem coordenador</text><circle cx="930" cy="300" r="140" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 10" stroke-linecap="round"/><text x="930" y="262" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="middle">mesma imagem</text><text x="930" y="286" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="middle">em cada nó</text><g opacity="1"><rect x="715" y="22" width="130" height="44" rx="22" fill="#0b1220" stroke="#334155" stroke-width="1.5"/><text x="780" y="50" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="middle">produtor</text></g><g opacity="1"><rect x="865" y="22" width="130" height="44" rx="22" fill="#0b1220" stroke="#334155" stroke-width="1.5"/><text x="930" y="50" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="middle">produtor</text></g><g opacity="1"><rect x="715" y="458" width="130" height="40" rx="20" fill="#0b1220" stroke="#334155" stroke-width="1.5"/><text x="780" y="484" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font