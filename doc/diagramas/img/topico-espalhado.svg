<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 685" width="1080" height="685" role="img" lang="pt-BR" aria-labelledby="t d" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
<title id="t">Um tópico espalhado e redundante</title>
<desc id="d">Matriz com as mensagens m1 a m6 do tópico pedidos nas linhas e os nós A, B, C e D nas colunas. Cada mensagem tem um primário e duas réplicas em nós distintos, e nenhum nó guarda todas as mensagens.</desc>
<rect width="1080" height="685" fill="#020617"/>
<text x="40" y="44" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="start">Um tópico espalhado e redundante</text><text x="40" y="66" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">tópico `pedidos`: 6 mensagens em 4 nós, fator de replicação 3 (m1 e m2 são as do diagrama do anel)</text><text x="60" y="124" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="start">mensagem</text><circle cx="259" cy="116" r="15" fill="#0b2a35" stroke="#22d3ee" stroke-width="2.5"/><text x="259" y="121" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">A</text><circle cx="377" cy="116" r="15" fill="#241a4a" stroke="#a78bfa" stroke-width="2.5"/><text x="377" y="121" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">B</text><circle cx="495" cy="116" r="15" fill="#33260a" stroke="#fbbf24" stroke-width="2.5"/><text x="495" y="121" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">C</text><circle cx="613" cy="116" r="15" fill="#3a121e" stroke="#fb7185" stroke-width="2.5"/><text x="613" y="121" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">D</text><rect x="40" y="144" width="642" height="48" rx="10" fill="#0b1220"/><text x="60" y="174" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="start">m1</text><rect x="213" y="150" width="92" height="38" rx="9" fill="#22d3ee" stroke="#22d3ee" stroke-width="2.5"/><text x="259" y="174" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">P</text><rect x="331" y="150" width="92" height="38" rx="9" fill="#020617" stroke="#a78bfa" stroke-width="2.5"/><text x="377" y="174" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">T</text><rect x="449" y="150" width="92" height="38" rx="9" fill="#33260a" stroke="#fbbf24" stroke-width="2.5"/><text x="495" y="174" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">S</text><rect x="567" y="150" width="92" height="38" rx="9" fill="none" stroke="#334155" stroke-dasharray="3 4"/><rect x="40" y="198" width="642" height="48" rx="10" fill="none"/><text x="60" y="228" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="start">m2</text><rect x="213" y="204" width="92" height="38" rx="9" fill="none" stroke="#334155" stroke-dasharray="3 4"/><rect x="331" y="204" width="92" height="38" rx="9" fill="#a78bfa" stroke="#a78bfa" stroke-width="2.5"/><text x="377" y="228" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">P</text><rect x="449" y="204" width="92" height="38" rx="9" fill="#33260a" stroke="#fbbf24" stroke-width="2.5"/><text x="495" y="228" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">S</text><rect x="567" y="204" width="92" height="38" rx="9" fill="#020617" stroke="#fb7185" stroke-width="2.5"/><text x="613" y="228" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">T</text><rect x="40" y="252" width="642" height="48" rx="10" fill="#0b1220"/><text x="60" y="282" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="start">m3</text><rect x="213" y="258" width="92" height="38" rx="9" fill="#020617" stroke="#22d3ee" stroke-width="2.5"/><text x="259" y="282" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">T</text><rect x="331" y="258" width="92" height="38" rx="9" fill="none" stroke="#334155" stroke-dasharray="3 4"/><rect x="449" y="258" width="92" height="38" rx="9" fill="#fbbf24" stroke="#fbbf24" stroke-width="2.5"/><text x="495" y="282" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">P</text><rect x="567" y="258" width="92" height="38" rx="9" fill="#3a121e" stroke="#fb7185" stroke-width="2.5"/><text x="613" y="282" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">S</text><rect x="40" y="306" width="642" height="48" rx="10" fill="none"/><text x="60" y="336" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="start">m4</text><rect x="213" y="312" width="92" height="38" rx="9" fill="#0b2a35" stroke="#22d3ee" stroke-width="2.5"/><text x="259" y="336" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">S</text><rect x="331" y="312" width="92" height="38" rx="9" fill="none" stroke="#334155" stroke-dasharray="3 4"/><rect x="449" y="312" width="92" height="38" rx="9" fill="#020617" stroke="#fbbf24" stroke-width="2.5"/><text x="495" y="336" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">T</text><rect x="567" y="312" width="92" height="38" rx="9" fill="#fb7185" stroke="#fb7185" stroke-width="2.5"/><text x="613" y="336" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">P</text><rect x="40" y="360" width="642" height="48" rx="10" fill="#0b1220"/><text x="60" y="390" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="start">m5</text><rect x="213" y="366" width="92" height="38" rx="9" fill="#22d3ee" stroke="#22d3ee" stroke-width="2.5"/><text x="259" y="390" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">P</text><rect x="331" y="366" width="92" height="38" rx="9" fill="#241a4a" stroke="#a78bfa" stroke-width="2.5"/><text x="377" y="390" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">S</text><rect x="449" y="366" width="92" height="38" rx="9" fill="none" stroke="#334155" stroke-dasharray="3 4"/><rect x="567" y="366" width="92" height="38" rx="9" fill="#020617" stroke="#fb7185" stroke-width="2.5"/><text x="613" y="390" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">T</text><rect x="40" y="414" width="642" height="48" rx="10" fill="none"/><text x="60" y="444" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="start">m6</text><rect x="213" y="420" width="92" height="38" rx="9" fill="none" stroke="#334155" stroke-dasharray="3 4"/><rect x="331" y="420" width="92" height="38" rx="9" fill="#a78bfa" stroke="#a78bfa" stroke-width="2.5"/><text x="377" y="444" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">P</text><rect x="449" y="420" width="92" height="38" rx="9" fill="#020617" stroke="#fbbf24" stroke-width="2.5"/><text x="495" y="444" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">T</text><rect x="567" y="420" width="92" height="38" rx="9" fill="#3a121e" stroke="#fb7185" stroke-width="2.5"/><text x="613" y="444" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">S</text><line x1="40" y1="480" x2="682" y2="480" stroke="#334155" stroke-width="1.5"/><text x="60" y="504" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="start">cada nó guarda</text><text x="259" y="502" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">4 de 6</text><text x="259" y="520" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">2P 1S 1T</text><text x="377" y="502" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">4 de 6</text><text x="377" y="520" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">2P 1S 1T</text><text x="495" y="502" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">5 de 6</text><text x="495" y="520" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">1P 2S 2T</text><text x="613" y="502" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">5 de 6</text><text x="613" y="520" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">1P 2S 2T</text><rect x="60" y="544" width="30" height="22" rx="6" fill="#94a3b8" stroke="#94a3b8" stroke-width="2"/><text x="75" y="560" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">P</text><text x="100" y="560" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">primário (dono)</text><rect x="240" y="544" width="30" height="22" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/><text x="255" y="560" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">S</text><text x="280" y="560" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">secundário</text><rect x="380" y="544" width="30" height="22" rx="6" fill="#020617" stroke="#94a3b8" stroke-width="2"/><text x="395" y="560" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">T</text><text x="420" y="560" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">terciário</text><rect x="510" y="544" width="30" height="22" rx="6" fill="none" stroke="#334155" stroke-dasharray="3 4"/><text x="550" y="560" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">não tem a mensagem</text><rect x="770" y="112" width="270" height="204" rx="12" fill="#0b1220" stroke="#334155"/><circle cx="790" cy="136" r="6" fill="#22d3ee"/><text x="804" y="141" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="start">Espalhado</text><text x="790" y="164" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• O ID decide o bloco, não o</text><text x="790" y="181" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  tópico: as mensagens caem em todo</text><text x="790" y="198" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  o anel.</text><text x="790" y="223" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• Nenhum nó guarda tudo, nem é dono</text><text x="790" y="240" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  do tópico. Cada um tem 4 ou 5 das</text><text x="790" y="257" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  6.</text><text x="790" y="282" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• Os primários se revezam entre A,</text><text x="790" y="299" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  B, C e D.</text><rect x="770" y="332" width="270" height="145" rx="12" fill="#0b1220" stroke="#334155"/><circle cx="790" cy="356" r="6" fill="#34d399"/><text x="804" y="361" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="start">Redundante</text><text x="790" y="384" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• Cada mensagem existe em 3 nós</text><text x="790" y="401" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  físicos distintos.</text><text x="790" y="426" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• Com quórum de 2 de 3, a escrita</text><text x="790" y="443" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  continua com uma réplica fora do</text><text x="790" y="460" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  ar.</text><rect x="770" y="493" width="270" height="162" rx="12" fill="#0b1220" stroke="#334155"/><circle cx="790" cy="517" r="6" fill="#fb7185"/><text x="804" y="522" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="start">Se o nó B cair</text><text x="790" y="545" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• m1, m2, m5 e m6 continuam em 2</text><text x="790" y="562" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  nós; nenhuma se perde.</text><text x="790" y="587" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• Os blocos de B passam ao próximo</text><text x="790" y="604" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  nó do anel e as réplicas são</text><text x="790" y="621" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  refeitas pela sincronização</text><text x="790" y="638" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  (seção 7.3).</text>
</svg>
