<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 668" width="1080" height="668" role="img" lang="en" aria-labelledby="t d" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
<title id="t">A spread, redundant topic</title>
<desc id="d">A matrix with messages m1 to m6 of topic orders in the rows and nodes A, B, C and D in the columns. Each message has a primary and two replicas on different nodes, and no node stores all the messages.</desc>
<rect width="1080" height="668" fill="#020617"/>
<text x="40" y="44" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="start">A spread, redundant topic</text><text x="40" y="66" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">topic `orders`: 6 messages on 4 nodes, replication factor 3 (m1 and m2 are the ones in the ring diagram)</text><text x="60" y="124" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="start">message</text><circle cx="259" cy="116" r="15" fill="#0b2a35" stroke="#22d3ee" stroke-width="2.5"/><text x="259" y="121" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">A</text><circle cx="377" cy="116" r="15" fill="#241a4a" stroke="#a78bfa" stroke-width="2.5"/><text x="377" y="121" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">B</text><circle cx="495" cy="116" r="15" fill="#33260a" stroke="#fbbf24" stroke-width="2.5"/><text x="495" y="121" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">C</text><circle cx="613" cy="116" r="15" fill="#3a121e" stroke="#fb7185" stroke-width="2.5"/><text x="613" y="121" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">D</text><rect x="40" y="144" width="642" height="48" rx="10" fill="#0b1220"/><text x="60" y="174" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="start">m1</text><rect x="213" y="150" width="92" height="38" rx="9" fill="#22d3ee" stroke="#22d3ee" stroke-width="2.5"/><text x="259" y="174" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">P</text><rect x="331" y="150" width="92" height="38" rx="9" fill="#020617" stroke="#a78bfa" stroke-width="2.5"/><text x="377" y="174" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">T</text><rect x="449" y="150" width="92" height="38" rx="9" fill="#33260a" stroke="#fbbf24" stroke-width="2.5"/><text x="495" y="174" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">S</text><rect x="567" y="150" width="92" height="38" rx="9" fill="none" stroke="#334155" stroke-dasharray="3 4"/><rect x="40" y="198" width="642" height="48" rx="10" fill="none"/><text x="60" y="228" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="start">m2</text><rect x="213" y="204" width="92" height="38" rx="9" fill="none" stroke="#334155" stroke-dasharray="3 4"/><rect x="331" y="204" width="92" height="38" rx="9" fill="#a78bfa" stroke="#a78bfa" stroke-width="2.5"/><text x="377" y="228" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">P</text><rect x="449" y="204" width="92" height="38" rx="9" fill="#33260a" stroke="#fbbf24" stroke-width="2.5"/><text x="495" y="228" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">S</text><rect x="567" y="204" width="92" height="38" rx="9" fill="#020617" stroke="#fb7185" stroke-width="2.5"/><text x="613" y="228" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">T</text><rect x="40" y="252" width="642" height="48" rx="10" fill="#0b1220"/><text x="60" y="282" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="start">m3</text><rect x="213" y="258" width="92" height="38" rx="9" fill="#020617" stroke="#22d3ee" stroke-width="2.5"/><text x="259" y="282" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">T</text><rect x="331" y="258" width="92" height="38" rx="9" fill="none" stroke="#334155" stroke-dasharray="3 4"/><rect x="449" y="258" width="92" height="38" rx="9" fill="#fbbf24" stroke="#fbbf24" stroke-width="2.5"/><text x="495" y="282" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">P</text><rect x="567" y="258" width="92" height="38" rx="9" fill="#3a121e" stroke="#fb7185" stroke-width="2.5"/><text x="613" y="282" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">S</text><rect x="40" y="306" width="642" height="48" rx="10" fill="none"/><text x="60" y="336" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="start">m4</text><rect x="213" y="312" width="92" height="38" rx="9" fill="#0b2a35" stroke="#22d3ee" stroke-width="2.5"/><text x="259" y="336" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">S</text><rect x="331" y="312" width="92" height="38" rx="9" fill="none" stroke="#334155" stroke-dasharray="3 4"/><rect x="449" y="312" width="92" height="38" rx="9" fill="#020617" stroke="#fbbf24" stroke-width="2.5"/><text x="495" y="336" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">T</text><rect x="567" y="312" width="92" height="38" rx="9" fill="#fb7185" stroke="#fb7185" stroke-width="2.5"/><text x="613" y="336" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">P</text><rect x="40" y="360" width="642" height="48" rx="10" fill="#0b1220"/><text x="60" y="390" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="start">m5</text><rect x="213" y="366" width="92" height="38" rx="9" fill="#22d3ee" stroke="#22d3ee" stroke-width="2.5"/><text x="259" y="390" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">P</text><rect x="331" y="366" width="92" height="38" rx="9" fill="#241a4a" stroke="#a78bfa" stroke-width="2.5"/><text x="377" y="390" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">S</text><rect x="449" y="366" width="92" height="38" rx="9" fill="none" stroke="#334155" stroke-dasharray="3 4"/><rect x="567" y="366" width="92" height="38" rx="9" fill="#020617" stroke="#fb7185" stroke-width="2.5"/><text x="613" y="390" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">T</text><rect x="40" y="414" width="642" height="48" rx="10" fill="none"/><text x="60" y="444" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="start">m6</text><rect x="213" y="420" width="92" height="38" rx="9" fill="none" stroke="#334155" stroke-dasharray="3 4"/><rect x="331" y="420" width="92" height="38" rx="9" fill="#a78bfa" stroke="#a78bfa" stroke-width="2.5"/><text x="377" y="444" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">P</text><rect x="449" y="420" width="92" height="38" rx="9" fill="#020617" stroke="#fbbf24" stroke-width="2.5"/><text x="495" y="444" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">T</text><rect x="567" y="420" width="92" height="38" rx="9" fill="#3a121e" stroke="#fb7185" stroke-width="2.5"/><text x="613" y="444" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">S</text><line x1="40" y1="480" x2="682" y2="480" stroke="#334155" stroke-width="1.5"/><text x="60" y="504" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="start">each node stores</text><text x="259" y="502" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">4 of 6</text><text x="259" y="520" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">2P 1S 1T</text><text x="377" y="502" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">4 of 6</text><text x="377" y="520" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">2P 1S 1T</text><text x="495" y="502" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">5 of 6</text><text x="495" y="520" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">1P 2S 2T</text><text x="613" y="502" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">5 of 6</text><text x="613" y="520" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">1P 2S 2T</text><rect x="60" y="544" width="30" height="22" rx="6" fill="#94a3b8" stroke="#94a3b8" stroke-width="2"/><text x="75" y="560" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">P</text><text x="100" y="560" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">primary (owner)</text><rect x="240" y="544" width="30" height="22" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/><text x="255" y="560" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">S</text><text x="280" y="560" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">secondary</text><rect x="380" y="544" width="30" height="22" rx="6" fill="#020617" stroke="#94a3b8" stroke-width="2"/><text x="395" y="560" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">T</text><text x="420" y="560" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">tertiary</text><rect x="510" y="544" width="30" height="22" rx="6" fill="none" stroke="#334155" stroke-dasharray="3 4"/><text x="550" y="560" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">does not have the message</text><rect x="770" y="112" width="270" height="204" rx="12" fill="#0b1220" stroke="#334155"/><circle cx="790" cy="136" r="6" fill="#22d3ee"/><text x="804" y="141" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="start">Spread</text><text x="790" y="164" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• The ID decides the block, not the</text><text x="790" y="181" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  topic: messages land all around</text><text x="790" y="198" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  the ring.</text><text x="790" y="223" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• No node stores everything or owns</text><text x="790" y="240" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  the topic. Each one has 4 or 5 of</text><text x="790" y="257" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  the 6.</text><text x="790" y="282" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• The primaries take turns among A,</text><text x="790" y="299" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  B, C and D.</text><rect x="770" y="332" width="270" height="145" rx="12" fill="#0b1220" stroke="#334155"/><circle cx="790" cy="356" r="6" fill="#34d399"/><text x="804" y="361" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="start">Redundant</text><text x="790" y="384" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• Each message exists on 3</text><text x="790" y="401" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  different physical nodes.</text><text x="790" y="426" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• With a quorum of 2 out of 3,</text><text x="790" y="443" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  writes continue with one replica</text><text x="790" y="460" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  down.</text><rect x="770" y="493" width="270" height="145" rx="12" fill="#0b1220" stroke="#334155"/><circle cx="790" cy="517" r="6" fill="#fb7185"/><text x="804" y="522" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="start">If node B goes down</text><text x="790" y="545" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• m1, m2, m5 and m6 stay on 2</text><text x="790" y="562" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  nodes; none is lost.</text><text x="790" y="587" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">• The blocks of B move to the next</text><text x="790" y="604" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  node on the ring and the replicas</text><text x="790" y="621" font-size="12" font-weight="400" fill="#f8fafc" text-anchor="start">  are rebuilt by synchronization.</text>
</svg>
