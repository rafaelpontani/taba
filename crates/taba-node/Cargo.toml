[package]
name = "taba-node"
description = "Nó do Taba: o binário `taba` e a biblioteca que os testes de integração usam."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "taba_node"
path = "src/lib.rs"

[[bin]]
name = "taba"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
http-body-util = "0.1.5"
ipnet = "2.12.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde_norway = "0.9.42"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-util = "0.7.19"
tower-http = { version = "0.7.1", features = ["catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.27.0", features = ["v7"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
