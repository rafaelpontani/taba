[package]
name = "taba-node"
description = "The Taba node: the `taba` binary and the library the integration tests use."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "taba_node"
path = "src/lib.rs"

[[bin]]
name = "taba"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
fs4 = "1.1.0"
getrandom = "0.4.3"
http-body-util = "0.1.5"
ipnet = "2.12.2"
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "logs"] }
opentelemetry-appender-tracing = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "grpc-tonic", "reqwest-blocking-client", "trace", "logs", "tls-ring"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "logs", "rt-tokio"] }
prost = "0.14"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
hyper = { version = "1", default-features = false, features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["server-auto", "server-graceful", "service", "tokio", "http1", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde_norway = "0.9.42"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = "0.7.19"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["catch-panic"] }
tower-service = "0.3.3"
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
x509-parser = { version = "0.18.1", features = ["verify"] }
uuid = { version = "1.27.0", features = ["v7"] }
rand = "0.9"
bytes = "1"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-config = "1.12.0"
utoipa = "6"
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
mimalloc = { version = "0.1.52", default-features = false }

[dev-dependencies]
mimalloc = { version = "0.1.52", default-features = false, features = ["extended"] }
jsonschema = { version = "0.30", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
