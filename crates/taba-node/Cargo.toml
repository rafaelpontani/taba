[package]
name = "taba-node"
description = "Nó do Taba: o binário `taba` e a biblioteca que os testes de integração usam."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "taba_node"
path = "src/lib.rs"

[[bin]]
name = "taba"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
fs4 = "1.1.0"
getrandom = "0.4.3"
http-body-util = "0.1.5"
ipnet = "2.12.2"
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "logs"] }
opentelemetry-appender-tracing = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "grpc-tonic", "reqwest-blocking-client", "trace", "logs", "tls-ring"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "logs", "rt-tokio"] }
prost = "0.14"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde_norway = "0.9.42"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-util = "0.7.19"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["catch-panic"] }
tower-service = "0.3.3"
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.27.0", features = ["v7"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
x509-parser = "0.18.1"
