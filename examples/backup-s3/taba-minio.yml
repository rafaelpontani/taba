# Optional S3 backup with MinIO (or any compatible S3: Ceph, Garage, SeaweedFS…).
# This is the node's configuration file (`--config` or TABA_CONFIG_FILE); every key also works as an
# environment variable (`backup.s3.bucket` -> TABA_BACKUP_S3_BUCKET). Doc: doc/pt-BR/33-backup-s3.md.
#
# It only shows what the backup adds; the rest of the node configuration (ports, cluster, secrets) is the
# usual one (doc/pt-BR/22-configuracao.md).

backup:
  s3:
    bucket: taba                    # turning the feature on is just this; without a bucket there is no backup
    endpoint: http://minio:9000     # outside AWS: the service address (turns path-style on by itself)
    access-key: taba                # the two keys go together...
    secret-key: change-this-key     # ...and never show up in logs; prefer the TABA_BACKUP_S3_SECRET_KEY variable
    prefix: taba                    # the "folder" in the bucket; several clusters can share a bucket

  # The defaults suit most cases; change them only with a reason.
  delay: 60s            # a message only goes up to S3 after this: one consumed earlier never goes
  meta:
    interval: 60s       # the lag (RPO) of the message state (delivery, invisibility, ack)
  heartbeat:
    interval: 15s       # how often the node tells the bucket it is alive
  dead-after: 60s       # with no heartbeat for this long, the node is considered dead (greater than heartbeat.interval)
  drain:
    timeout: 30s        # how long the drain and the flush wait for S3; the orchestrator's stop deadline must
                        # exceed drain.timeout + this value (the repository's Compose uses 70 s)
  disk:
    evict-above: 85     # disk above this: deletes the body of messages that are already in S3
    evict-to: 70
    pause-at: 90        # on flush and drain, the memory-to-disk pass pauses at this usage

# Stop: the orchestrator must wait for the upload to S3.
drain:
  timeout: 25s
