# Redpanda (um nó). Fala o protocolo do Kafka; o OMB o mede com o driver kafka. Sem o modo dev-container, que
# desliga o fsync. SMP e memória acompanham os limites do contêiner.
services:
  server:
    image: redpandadata/redpanda:v24.2.7
    cpus: ${BENCH_CPUS}
    mem_limit: ${BENCH_MEMORY}
    env_file: env-${BENCH_DURABILITY}
    command:
      - redpanda
      - start
      - --smp=${BENCH_SMP}
      - --memory=${BENCH_REDPANDA_MEMORY}
      - --reserve-memory=0M
      - --overprovisioned
      - --check=false
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://server:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 3s
      timeout: 10s
      retries: 60
