# HAProxy do cluster de três nós do benchmark (compose-cluster.yml): o mesmo papel do docker/haproxy.cfg do Compose.
global
    maxconn 8192

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s
    hold nx 1s

defaults
    timeout connect 3s
    timeout client  60s
    timeout server  60s

# API de clientes. Um nó só entra no rodízio quando está pronto (/health/ready, na porta de operações).
frontend api
    bind *:8080
    mode http
    default_backend api_nodes

backend api_nodes
    mode http
    balance roundrobin
    option httpchk GET /health/ready
    http-check expect status 200
    default-server inter 1s fall 2 rise 1 port 9090 init-addr none resolvers docker
    server node-0 node-0:8080 check
    server node-1 node-1:8080 check
    server node-2 node-2:8080 check

# Porta do cluster: só a descoberta passa por aqui, em TCP.
frontend cluster
    bind *:8081
    mode tcp
    default_backend cluster_nodes

backend cluster_nodes
    mode tcp
    balance roundrobin
    option httpchk GET /health/live
    http-check expect status 200
    default-server inter 1s fall 2 rise 1 port 9090 init-addr none resolvers docker
    server node-0 node-0:8081 check
    server node-1 node-1:8081 check
    server node-2 node-2:8081 check
