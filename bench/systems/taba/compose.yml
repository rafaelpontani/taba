# Taba: um nó, fator de replicação 1, sem TLS, com token de desenvolvimento (o mesmo perfil de connectors/contract).
# A imagem vem de BENCH_TABA_IMAGE (o run.sh constrói a do commit atual ou usa a informada em --taba-image).
services:
  server:
    image: ${BENCH_TABA_IMAGE}
    cpus: ${BENCH_CPUS}
    mem_limit: ${BENCH_MEMORY}
    env_file: env-${BENCH_DURABILITY}
    environment:
      TABA_REPLICATION_FACTOR: "1"
      TABA_CLUSTER_TLS_ENABLED: "false"
      TABA_AUTH_DEV_TOKEN: bench-dev-secret-0123456789abcdef0123456
      TABA_OPERATIONS_PORT: "9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 60
